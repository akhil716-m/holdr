/* ========================== SEEDED TRENDS ================================== */
function seedFromString(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h) || 1; }
function seedRandom(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function genTrend(seedStr, end, points = 26, biasUp = true) {
  const rnd = seedRandom(seedFromString(seedStr));
  let val = end * (biasUp ? (0.90 + rnd() * 0.05) : (1.05 + rnd() * 0.06));
  const arr = [val];
  for (let i = 1; i < points; i++) {
    const pull = (end - val) / (points - i) * 0.55;
    const noise = (rnd() - 0.5) * end * 0.022;
    val = val + pull + noise;
    arr.push(val);
  }
  arr[arr.length - 1] = end;
  return arr;
}

  }, [theme]);
  return [theme, setTheme];
}

/* ============================= PRIMITIVES ================================== */
/* tiny delta pill — Fey's signature element */
function Delta({ value, suffix = '%', precision = 1 }) {
  if (value === null || value === undefined) return null;
  const up = value >= 0;
  return (
    <span className="num inline-flex items-center px-1.5 py-[2px] rounded-[5px] text-[10.5px] font-semibold leading-none"
      style={{ background: up ? 'var(--up-soft)' : 'var(--down-soft)', color: up ? 'var(--up)' : 'var(--down)' }}>
      {up ? '+' : ''}{value.toFixed(precision)}{suffix}
    </span>
  );
}

function Pill({ tone = 'up', children, dot }) {
  return (
    <span className="inline-flex items-center gap-1.5 px-2 py-[3px] rounded-md text-[10.5px] font-semibold whitespace-nowrap"
      style={{ background: `var(--${tone}-soft)`, color: `var(--${tone})` }}>
      {dot && <span className="w-1 h-1 rounded-full" style={{ background: `var(--${tone})` }}></span>}
      {children}
    </span>
  );
}

function Mark({ mono, hue, size = 'md' }) {
  const dims = size === 'lg' ? 'w-10 h-10 text-[12px]' : size === 'sm' ? 'w-7 h-7 text-[9px]' : 'w-8 h-8 text-[10px]';
  return (
    <div className={`${dims} rounded-full flex items-center justify-center font-semibold font-mono shrink-0`}
      style={{ background: `${hue}16`, color: hue, border: `1px solid ${hue}26` }}>
      {mono}
    </div>
  );
}

/* ============================= TICKER TAPE ================================= */
function TickerTape({ holdings, trends }) {
  const items = holdings.map(h => ({ symbol: h.symbol, ltp: h.ltp, change: trends[h.id]?.dayChange ?? 0 }));
  const strip = [...items, ...items];
  return (
    <div className="tape-mask relative z-10" style={{ borderBottom: '1px solid var(--border)' }}>
      <div className="tape py-1.5">
        {strip.map((it, i) => (
          <div key={i} className="flex items-center gap-2 px-5 whitespace-nowrap">
            <span className="text-[10.5px] font-medium text-faint">{it.symbol}</span>
            <span className="text-[10.5px] num text-muted">{fmtINR(it.ltp)}</span>
            <Delta value={it.change} precision={2} />
          </div>
        ))}
      </div>
    </div>
  );
}

/* =============================== CHARTS ==================================== */
/* monochrome hero chart — white line, grey benchmark, like Fey */
function CompareChart({ portfolio, benchmark, height = 230 }) {
  const width = 820, pad = 16, h = height - pad * 2;
  const norm = arr => arr.map(v => (v / arr[0]) * 100);
  const p = norm(portfolio), b = norm(benchmark);
  const all = [...p, ...b];
  const min = Math.min(...all), max = Math.max(...all);
  const range = (max - min) || 1;
  const y = v => pad + (h - ((v - min) / range) * h);
  const toLine = arr => {
    const stepX = width / (arr.length - 1);
    return arr.map((v, i) => (i === 0 ? 'M' : 'L') + (i * stepX).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  };
  const pLine = toLine(p), bLine = toLine(b);
  const pArea = `${pLine} L ${width},${height} L 0,${height} Z`;
  const lastPY = y(p[p.length - 1]);
  return (
    <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="w-full" style={{ height }}>
      <defs>

function Sparkline({ data, id, width = 96, height = 28, mono = true, positive = true }) {
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const stepX = width / (data.length - 1);
  const pts = data.map((d, i) => [i * stepX, height - ((d - min) / range) * (height - 4) - 2]);
  const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const color = mono ? 'var(--chart-grey)' : (positive ? 'var(--up)' : 'var(--down)');
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible shrink-0">
      <path d={line} fill="none" stroke={color} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2" fill={color} />
    </svg>
  );
}

/* ============================== TAX VIEW =================================== */
function TaxView({ holdings }) {
  const rows = holdings.map(h => ({ h, t: taxInfo(h) }));
  const ltGain = rows.filter(r => r.t.isLT && r.t.gain > 0).reduce((a, r) => a + r.t.gain, 0);
  const stGain = rows.filter(r => !r.t.isLT && r.t.gain > 0).reduce((a, r) => a + r.t.gain, 0);
  const losses = rows.filter(r => r.t.gain < 0).reduce((a, r) => a + r.t.gain, 0);
  const ltTaxable = Math.max(0, ltGain - LTCG_EXEMPTION);
  const ltTax = ltTaxable * LTCG_RATE;
  const stTax = stGain * STCG_RATE;
  const totalTax = ltTax + stTax;
  const netGain = ltGain + stGain + losses;
  const harvestables = rows.filter(r => r.t.gain < 0);
  const exemptionUsed = Math.min(ltGain, LTCG_EXEMPTION);
  const exemptionLeft = LTCG_EXEMPTION - exemptionUsed;
  const stLosses = harvestables.filter(r => !r.t.isLT).reduce((a, r) => a + r.t.gain, 0);
  const harvestSaving = Math.min(Math.abs(stLosses), stGain) * STCG_RATE;

  /* smart moves — turn state into actions, ranked by rupee impact */
  const moves = [];
  if (ltGain > 0 && ltTaxable === 0) {

  rows.filter(r => !r.t.isLT && r.t.gain > 0).forEach(({ h, t }) => {
    const save = t.gain * (STCG_RATE - LTCG_RATE);

  if (stLosses < 0 && stGain > 0) {

                  {dateStr} · {multi ? `${g.items[0].t.daysToLT}–${g.items[g.items.length - 1].t.daysToLT}d` : `${g.items[0].t.daysToLT}d`}
                </p>
                {totalSave > 0 && <p className="text-[10px] num whitespace-nowrap text-center mt-0.5" style={{ color: 'var(--up)' }}>+{fmtINR(Math.round(totalSave))} if you wait</p>}
                {multi && <p className="text-[9px] num text-faint whitespace-nowrap text-center mt-0.5">{g.items.map(r => r.h.symbol).slice(0, 3).join(' · ')}{g.items.length > 3 ? ' +' + (g.items.length - 3) : ''}</p>}
              </div>
            );
          };

          return (
            <div className="mt-6 px-2">
              <div className="relative" style={{ height: (alternate ? LANE : 0) + AXIS + LANE }}>
                {/* axis */}
                {(() => { const axisY = (alternate ? LANE : 0) + AXIS / 2; return (
                  <React.Fragment>
                    <div className="absolute left-0 right-0 h-px" style={{ background: 'var(--border-strong)', top: axisY }}></div>
                    {/* today cap */}
                    <div className="absolute" style={{ left: 0, top: axisY - 3 }}>
                      <div className="w-[7px] h-[7px] rounded-full" style={{ background: 'var(--text)' }}></div>
                      <p className="text-[9.5px] num text-faint mt-1.5">today</p>
                    </div>
                    {/* FY end cap */}
                    <div className="absolute" style={{ right: 0, top: axisY - 4 }}>
                      <div className="w-px h-[9px] ml-auto" style={{ background: 'var(--border-strong)' }}></div>
                      <p className="text-[9.5px] num text-faint mt-1.5 text-right">FY end · 31 Mar</p>
                    </div>
                    {/* markers */}
                    {groups.map((g, gi) => {
                      const multi = g.items.length > 1;
                      const above = alternate && gi % 2 === 0;
                      return (
                        <React.Fragment key={gi}>
                          {/* dot centered on axis */}
                          <div className="absolute" style={{ left: `${pos(g.date)}%`, top: axisY, transform: 'translate(-50%, -50%)' }}>
                            {multi
                              ? <div className="min-w-[18px] h-[18px] px-1 rounded-full flex items-center justify-center num text-[9px] font-medium" style={{ background: 'var(--surface)', border: '1.5px solid var(--text-muted)' }}>{g.items.length}</div>
                              : <div className="w-[7px] h-[7px] rounded-full" style={{ background: 'var(--surface)', border: '1.5px solid var(--text-muted)' }}></div>}
                          </div>
                          {/* label in its lane, never overlapping the axis or header */}
                          <div className="absolute flex justify-center" style={{
                            left: `${pos(g.date)}%`, transform: 'translateX(-50%)',
                            ...(above ? { bottom: AXIS + LANE, alignItems: 'flex-end' } : { top: (alternate ? LANE : 0) + AXIS, alignItems: 'flex-start' }),
                          }}>
                            <Label g={g} />
                          </div>
                        </React.Fragment>
                      );
                    })}
                  </React.Fragment>
                ); })()}
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

function App() {
  const [theme, setTheme] = useTheme();

  const [holdings, setHoldings] = useState(DEMO_HOLDINGS);
  const [active, setActive] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [tab, setTab] = useState('today');
  const [filter, setFilter] = useState('all');
  const [toast, setToast] = useState(null);
  const [period, setPeriod] = useState(investorMode === 'active' ? '1W' : '1Y');

  useEffect(() => { localStorage.setItem('holdr-mode', investorMode); }, [investorMode]);
  const flash = msg => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const setMode = m => {
    setInvestorMode(m);
    setPeriod(m === 'active' ? '1W' : '1Y');
    flash(m === 'active' ? 'Active — day moves and momentum first' : 'Long-term — the calm, zoomed-out view');
  };

  const handleAdd = entry => {
    if (entry === 'demo-batch') {
      const fresh = DEMO_HOLDINGS.filter(h => !holdings.some(x => x.id === h.id));
      if (fresh.length === 0) { flash('Sample portfolio is already loaded'); return; }
      setHoldings(prev => [...prev, ...fresh]);
      flash(`Imported ${fresh.length} holdings from your file`);
    } else {
      setHoldings(prev => [entry, ...prev.filter(h => h.id !== entry.id)]);
      flash(`${entry.symbol} added to your portfolio`);
    }
  };

  const totals = useMemo(() => {
    const invested = holdings.reduce((a, h) => a + h.qty * h.avgPrice, 0);
    const current = holdings.reduce((a, h) => a + h.qty * h.ltp, 0);
    const pnl = current - invested;
    const needsReview = holdings.filter(h => h.action === 'review').length;
    const avgSentiment = Math.round(holdings.reduce((a, h) => a + h.sentimentScore, 0) / (holdings.length || 1));
    const alphaPeriod = holdings.reduce((a, h) => a + h.alpha * (h.qty * h.ltp), 0) / (current || 1);
    return { invested, current, pnl, pnlPct: (pnl / invested) * 100, needsReview, avgSentiment, alphaPeriod };
  }, [holdings]);

  const trends = useMemo(() => {
    const map = {};
    holdings.forEach(h => {
      map[h.id] = {
        series: genTrend(h.id + period, h.ltp, 26, h.ltp >= h.avgPrice),
        dayChange: ((seedRandom(seedFromString(h.id + 'day'))() * 5 - 2.5) + (h.sentiment === 'positive' ? 0.6 : h.sentiment === 'negative' ? -0.6 : 0)),
      };
    });
    return map;
  }, [holdings, period]);

  const portfolioTrend = useMemo(() => genTrend('portfolio-' + period + holdings.length, totals.current, 34, totals.pnl >= 0), [totals.current, totals.pnl, holdings.length, period]);
  const benchmarkTrend = useMemo(() => genTrend('nifty-' + period, 100, 34, true), [period]);

  const filtered = useMemo(() => {
    let list = holdings.filter(h => filter === 'all' ? true : h.action === filter);
    if (investorMode === 'active') {
      list = [...list].sort((a, b) => Math.abs(trends[b.id]?.dayChange ?? 0) - Math.abs(trends[a.id]?.dayChange ?? 0));
    } else {
      const order = { review: 0, watch: 1, hold: 2 };
      list = [...list].sort((a, b) => order[a.action] - order[b.action]);
    }
    return list;
  }, [holdings, filter, investorMode, trends]);

  const mood = totals.avgSentiment >= 60 ? 'positive' : totals.avgSentiment >= 45 ? 'neutral' : 'cautious';
  const filters = [['all', 'All'], ['hold', 'Looking good'], ['watch', 'Watching'], ['review', 'Needs review']];
  const periods = ['1D', '1W', '1M', '3M', 'YTD', '1Y', 'All'];
  const dockItems = [
    ['today', 'Today', Icon.home],
    ['holdings', 'Holdings', Icon.list],
    ['tax', 'Tax', Icon.percent],
    ['discover', 'Discover', Icon.compass],
  ];

  return (
    <div className="min-h-screen pb-28 relative">
      <div className="ambience"></div>

      {/* Header — minimal, Fey-like */}
      <header className="relative z-20">
        <div className="max-w-6xl mx-auto px-5 sm:px-8 pt-5 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-7 h-7 rounded-lg surface flex items-end justify-center gap-[2.5px] pb-[6px]">
              <span className="w-[2.5px] h-[7px] rounded-full" style={{ background: 'var(--down)', opacity: .9 }}></span>
              <span className="w-[2.5px] h-[12px] rounded-full" style={{ background: 'var(--accent)' }}></span>
              <span className="w-[2.5px] h-[9px] rounded-full" style={{ background: 'var(--up)', opacity: .9 }}></span>
            </div>
            <p className="font-medium tracking-tight text-[14px]">Holdr</p>
          </div>
          <div className="flex items-center gap-2">
            <div className="hidden md:flex surface rounded-full p-[3px]">
              {[['longterm', 'Long-term'], ['active', 'Active']].map(([key, label]) => (
                <button key={key} onClick={() => setMode(key)}
                  className="px-3 py-1 rounded-full text-[11px] font-medium transition-colors"
                  style={investorMode === key ? { background: 'var(--surface-2)', color: 'var(--text)', border: '1px solid var(--border-strong)' } : { color: 'var(--text-faint)', border: '1px solid transparent' }}>
                  {label}
                </button>
              ))}
            </div>
            <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full surface">
              <span className="w-1 h-1 rounded-full pulse-dot" style={{ background: 'var(--up)', color: 'var(--up)' }}></span>
              <span className="text-[10.5px] font-medium text-muted">Markets are open</span>
            </div>
          </div>
        </div>
      </header>

      {investorMode === 'active' && <div className="mt-4"><TickerTape holdings={holdings} trends={trends} /></div>}

      <main className="max-w-6xl mx-auto px-5 sm:px-8 relative z-10">

        {tab === 'today' && (
          <div className="fade-up">
            {/* editorial greeting */}
            <section className="mt-9">
              <p className="text-[12px] num text-faint">{TODAY.toLocaleDateString('en-IN', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
              <h1 className="text-[20px] font-medium tracking-tight mt-1">
                Hello, Akhil. Your portfolio is <span style={{ color: mood === 'positive' ? 'var(--up)' : mood === 'neutral' ? 'var(--warn)' : 'var(--down)' }}>{mood}</span>.
              </h1>
            </section>

            <section className="mt-6 grid lg:grid-cols-5 gap-3 items-stretch">
              {/* chart card */}
              <div className="lg:col-span-3 surface rounded-2xl overflow-hidden flex flex-col">
                <div className="p-5 pb-0">
                  <div className="flex items-baseline gap-2.5 flex-wrap">
                    <p className="text-[28px] num font-medium tracking-tight leading-none">{fmtINR(Math.round(totals.current))}</p>
                    <Delta value={totals.pnlPct} />
                    <span className="text-[11px] num text-faint">{fmtSigned(Math.round(totals.pnl))} all-time</span>
                  </div>
                  <div className="flex items-center gap-2 mt-2">
                    <Delta value={totals.alphaPeriod} />
                    <span className="text-[10.5px] text-faint">vs NIFTY 50 · invested {fmtINR(Math.round(totals.invested))}</span>
                  </div>
                </div>
                <div className="mt-3 flex-1">
                  <CompareChart key={period} portfolio={portfolioTrend} benchmark={benchmarkTrend} height={220} />
                </div>
                <div className="flex items-center justify-between px-5 py-3" style={{ borderTop: '1px solid var(--border)' }}>
                  <div className="flex items-center gap-1">
                    {periods.map(p => (
                      <button key={p} onClick={() => setPeriod(p)}
                        className="px-2 py-1 rounded-md text-[10.5px] num font-medium transition-colors"
                        style={period === p ? { background: 'var(--surface-2)', color: 'var(--text)', border: '1px solid var(--border-strong)' } : { color: 'var(--text-faint)', border: '1px solid transparent' }}>
                        {p}
                      </button>
                    ))}
                  </div>
                  <span className="text-[10.5px] text-faint hidden sm:block">
                    {totals.needsReview ? <span style={{ color: 'var(--down)' }}>{totals.needsReview} flagged</span> : 'all clear'} · {holdings.length} positions
                  </span>
                </div>
                {/* sector list inside the chart card, like Fey's home */}
                <div className="px-3 pb-3 pt-1" style={{ borderTop: '1px solid var(--border)' }}>
                  <p className="text-[10px] uppercase tracking-[0.1em] text-faint font-semibold px-2.5 pt-3 pb-1.5">Sectors · 3M momentum</p>
                  <SectorList holdings={holdings} />
                </div>
              </div>

              {/* right rail: recap + feed */}
              <div className="lg:col-span-2 flex flex-col gap-3">
                <DailyRecap holdings={holdings} totals={totals} mode={investorMode} />
                <div className="surface rounded-2xl p-5 flex-1 min-h-0">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-[11px] font-semibold uppercase tracking-[0.1em] text-faint">Your holdings in the news</p>
                  </div>
                  <div className="overflow-y-auto max-h-[480px] pr-1">
                    {NEWS_FEED.map((item, i) => (
                      <NewsRow key={i} item={item} holding={holdings.find(h => h.id === item.stockId) || null} last={i === NEWS_FEED.length - 1} />
                    ))}
                  </div>
                </div>
              </div>
            </section>
          </div>
        )}

        {tab === 'holdings' && (
          <div className="fade-up">
            <section className="mt-9 flex items-center justify-between gap-3 flex-wrap">
              <h1 className="text-[20px] font-medium tracking-tight">Holdings</h1>
              <div className="flex items-center gap-1.5">
                {filters.map(([key, label]) => (
                  <button key={key} onClick={() => setFilter(key)}
                    className="whitespace-nowrap px-3 py-1.5 rounded-full text-[11.5px] font-medium transition-colors"
                    style={filter === key ? { background: 'var(--text)', color: 'var(--bg)' } : { background: 'var(--surface)', color: 'var(--text-muted)', border: '1px solid var(--border)' }}>
                    {label}
                  </button>
                ))}
              </div>
            </section>
            <p className="text-[11px] num text-faint mt-2">{investorMode === 'active' ? 'sorted by day move' : 'sorted by attention'} · {filtered.length} of {holdings.length} positions</p>

            <section className="mt-4 surface rounded-2xl overflow-hidden">
              <div className="hidden sm:flex items-center gap-4 px-4 py-2.5 text-[9px] uppercase tracking-[0.1em] text-faint font-semibold" style={{ borderBottom: '1px solid var(--border)' }}>
                <div className="w-[44%] sm:w-[26%]">Position</div>
                <div className="hidden md:block w-[13%]">Trend</div>
                <div className="hidden sm:block w-[17%]">Price / Day</div>
                <div className="flex-1 sm:flex-none sm:w-[17%]">P&amp;L</div>
                <div className="hidden lg:block w-[11%]">vs NIFTY</div>
                <div className="hidden lg:block w-[11%]">Tax</div>
                <div className="hidden xl:block w-[10%] text-right">Thesis</div>
                <div className="w-3.5"></div>
              </div>
              {filtered.map(h => (
                <HoldingRow key={h.id} h={{ ...h, _dayChange: trends[h.id].dayChange }} trend={trends[h.id].series} onOpen={setActive} />
              ))}
              {filtered.length === 0 && (
                <div className="text-center py-16 text-faint"><p className="text-[12.5px]">Nothing in this view — try another filter.</p></div>
              )}
            </section>

            <button onClick={() => setShowAdd(true)}
              className="mt-4 w-full rounded-2xl p-4.5 py-4 text-center hov"
              style={{ border: '1px dashed var(--border-strong)' }}>
              <p className="font-medium text-[12.5px]">+ Add another position</p>
              <p className="text-[10.5px] text-faint mt-0.5">Search & add, or upload your broker's P&L statement</p>
            </button>
          </div>
        )}

        {tab === 'tax' && (
          <div className="fade-up">
            <section className="mt-9 mb-4">
              <h1 className="text-[20px] font-medium tracking-tight">Tax</h1>
              <p className="text-[11.5px] text-faint mt-1">Indicative planning numbers — confirm with a tax professional before acting.</p>
            </section>
            <TaxView holdings={holdings} />
          </div>
        )}

        {tab === 'discover' && (
          <div className="fade-up">
            <section className="mt-9 mb-4">
              <h1 className="text-[20px] font-medium tracking-tight">Discover</h1>
              <p className="text-[11.5px] text-faint mt-1">What's moving in the market, mapped against what you hold.</p>
            </section>
            <DiscoverView holdings={holdings} />
          </div>
        )}
      </main>

      {/* floating dock */}
      <nav className="dock">
        {dockItems.map(([key, label, Ic]) => (
          <button key={key} onClick={() => setTab(key)} className={`dock-btn ${tab === key ? 'active' : ''}`}>
            <Ic />
            <span className="dock-label">{label}</span>
          </button>
        ))}
        <div className="dock-sep"></div>
        <button onClick={() => setShowAdd(true)} className="dock-btn">
          <Icon.plus />
          <span className="dock-label">Add holding</span>
        </button>
        <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="dock-btn">
          {theme === 'dark' ? <Icon.sun /> : <Icon.moon />}
          <span className="dock-label">{theme === 'dark' ? 'Light mode' : 'Dark mode'}</span>
        </button>
      </nav>

      {active && <HoldingDetail h={active} trend={trends[active.id]?.series || genTrend(active.id, active.ltp)} onClose={() => setActive(null)} />}
      {showAdd && <AddHoldingModal onClose={() => setShowAdd(false)} onAdd={handleAdd} />}

      {toast && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[70] text-[12px] font-medium px-4 py-2.5 rounded-full shadow-2xl fade-up"
          style={{ background: 'var(--text)', color: 'var(--bg)' }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
