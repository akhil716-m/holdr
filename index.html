/* ================================= APP ===================================== */
function App() {
  const [theme, setTheme] = useTheme();
  const [investorMode, setInvestorMode] = useState(() => localStorage.getItem('holdr-mode') || 'longterm');
  const [profile, setProfile] = useState(() => localStorage.getItem('holdr-profile') || 'You');
  const [profiles, setProfiles] = useState(() => {
    try { return JSON.parse(localStorage.getItem('holdr-profiles')) || ['You']; } catch { return ['You']; }
  });
  const [demoHoldings, setDemoHoldings] = useState(DEMO_HOLDINGS);
  const [liveHoldings, setLiveHoldings] = useState(() => {
    try { return JSON.parse(localStorage.getItem(`holdr-live-${profile}`)) || []; } catch { return []; }
  });
  const baseHoldings = investorMode === 'active' ? liveHoldings : demoHoldings;
  const setBaseHoldings = investorMode === 'active' ? setLiveHoldings : setDemoHoldings;
  const [active, setActive] = useState(null);
  const [bento, setBento] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [tab, setTab] = useState('canvas');
  const [filter, setFilter] = useState('all');
  const [toast, setToast] = useState(null);
  const [period, setPeriod] = useState(investorMode === 'active' ? '1W' : '1Y');
  const [live, setLive] = useState({ quotes: {}, nifty: null, macro: {}, flows: null, status: 'loading', updated: null });

  useEffect(() => { localStorage.setItem('holdr-mode', investorMode); }, [investorMode]);
  useEffect(() => { localStorage.setItem('holdr-profile', profile); }, [profile]);
  useEffect(() => { localStorage.setItem('holdr-profiles', JSON.stringify(profiles)); }, [profiles]);
  useEffect(() => { localStorage.setItem(`holdr-live-${profile}`, JSON.stringify(liveHoldings)); }, [liveHoldings, profile]);

  const switchProfile = name => {
    if (name === profile) return;
    setProfile(name);
    try { setLiveHoldings(JSON.parse(localStorage.getItem(`holdr-live-${name}`)) || []); } catch { setLiveHoldings([]); }
  };
  const addProfile = name => {
    const clean = name.trim();
    if (!clean || profiles.includes(clean)) return;
    setProfiles(prev => [...prev, clean]);
    switchProfile(clean);
  };

  const flash = msg => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  /* live quotes: holdings + NIFTY per selected period, macro daily; demo fallback */
  useEffect(() => {
    let cancelled = false;
    async function load() {
      const { range, interval } = PERIOD_API[period] || PERIOD_API['1M'];
      const tasks = [
        { kind: 'nifty', sym: '^NSEI', range, interval },
        ...baseHoldings.map(h => ({ kind: 'quote', key: h.symbol, sym: ySymbol(h.symbol), range, interval })),
        ...MACRO_SYMBOLS.map(([id, sym]) => ({ kind: 'macro', key: id, sym, range: '1mo', interval: '1d' })),
      ];
      const results = await mapLimit(tasks, 3, async t => {
        if (t.kind === 'macro') return fetchChart(t.sym, t.range, t.interval);
        const up = await fetchUpstoxChart(t.kind === 'nifty' ? 'NIFTY' : t.key, period);
        return up || fetchChart(t.sym, t.range, t.interval);
      });
      if (cancelled) return;
      const niftyRes = results[tasks.findIndex(t => t.kind === 'nifty')];
      const quoteRes = tasks.map((t, i) => t.kind === 'quote' ? [t.key, results[i]] : null).filter(Boolean);
      const macroRes = tasks.map((t, i) => t.kind === 'macro' ? [t.key, results[i]] : null).filter(Boolean);
      const quotes = {};
      quoteRes.forEach(([s, q]) => { if (q) quotes[s] = q; });
      const inrQ = macroRes.find(([id]) => id === 'usdinr');
      const inr = inrQ && inrQ[1] ? inrQ[1].price : null;
      const macro = {};
      macroRes.forEach(([id, q]) => {
        if (!q) return;
        let display = null;
        if (id === 'usdinr') display = '₹' + q.price.toFixed(2);
        if (id === 'gold' && inr) display = '₹' + Math.round(q.price * inr / OZ_GRAMS * 10).toLocaleString('en-IN');
        if (id === 'silver' && inr) display = '₹' + Math.round(q.price * inr / OZ_GRAMS * 1000).toLocaleString('en-IN');
        if (id === 'crude') display = '$' + q.price.toFixed(1);
        if (id === 'vix') display = q.price.toFixed(1);
        macro[id] = { display, chg: q.dayChg, closes: q.closes };
      });
      const flows = await fetchFlows();
      if (cancelled) return;
      const source = Object.values(quotes).some(q => q.src === 'upstox') ? 'upstox' : 'yahoo';
      setLive({ quotes, nifty: niftyRes, macro, flows, source, status: Object.keys(quotes).length ? 'live' : 'demo', updated: new Date() });
    }
    load();
    const iv = setInterval(load, 120000);
    return () => { cancelled = true; clearInterval(iv); };
  }, [period, baseHoldings]);

  /* holdings with live LTP when available */
  const holdings = useMemo(() => baseHoldings.map(h => {
    const q = live.quotes[h.symbol];
    return q ? { ...h, ltp: q.price } : h;
  }), [baseHoldings, live.quotes]);

  const setMode = m => {
    setInvestorMode(m);
    setPeriod(m === 'active' ? '1W' : '1Y');
    flash(m === 'active' ? 'Live — day moves and momentum first' : 'Demo — the calm, zoomed-out view');
  };

  const handleAdd = entry => {
    if (Array.isArray(entry)) {
      const fresh = entry.filter(h => !baseHoldings.some(x => x.id === h.id));
      if (fresh.length === 0) { flash('These holdings are already in your portfolio'); return; }
      setBaseHoldings(prev => [...prev, ...fresh]);
      flash(`Imported ${fresh.length} holding${fresh.length > 1 ? 's' : ''} from your file`);
    } else {
      setBaseHoldings(prev => [entry, ...prev.filter(h => h.id !== entry.id)]);
      flash(`${entry.symbol} added to your portfolio`);
    }
  };

  const totals = useMemo(() => {
    const invested = holdings.reduce((a, h) => a + h.qty * h.avgPrice, 0);
    const current = holdings.reduce((a, h) => a + h.qty * h.ltp, 0);
    const pnl = current - invested;
    const needsReview = holdings.filter(h => h.action === 'review').length;
    const avgSentiment = Math.round(holdings.reduce((a, h) => a + h.sentimentScore, 0) / (holdings.length || 1));
    const alphaPeriod = holdings.reduce((a, h) => a + h.alpha * (h.qty * h.ltp), 0) / (current || 1);
    return { invested, current, pnl, pnlPct: (pnl / invested) * 100, needsReview, avgSentiment, alphaPeriod };
  }, [holdings]);

  const trends = useMemo(() => {
    const map = {};
    holdings.forEach(h => {
      const q = live.quotes[h.symbol];
      map[h.id] = {
        series: q && q.closes.length > 2 ? q.closes : genTrend(h.id + period, h.ltp, 26, h.ltp >= h.avgPrice),
        dayChange: q ? q.dayChg : ((seedRandom(seedFromString(h.id + 'day'))() * 5 - 2.5) + (h.sentiment === 'positive' ? 0.6 : h.sentiment === 'negative' ? -0.6 : 0)),
      };
    });
    return map;
  }, [holdings, period, live.quotes]);

  /* portfolio value series: sum of qty × live closes when every holding has data */
  const portfolioTrend = useMemo(() => {
    const series = holdings.map(h => live.quotes[h.symbol] && live.quotes[h.symbol].closes);
    if (series.length && series.every(s => s && s.length > 2)) {
      const L = Math.min(...series.map(s => s.length));
      return Array.from({ length: L }, (_, i) =>
        holdings.reduce((sum, h, hi) => sum + h.qty * series[hi][series[hi].length - L + i], 0));
    }
    return genTrend('portfolio-' + period + holdings.length, totals.current, 34, totals.pnl >= 0);
  }, [holdings, live.quotes, totals.current, totals.pnl, period]);

  const benchmarkTrend = useMemo(() =>
    (live.nifty && live.nifty.closes.length > 2) ? live.nifty.closes : genTrend('nifty-' + period, 100, 34, true),
  [live.nifty, period]);

  /* "bear" ambience kicks in when NIFTY is down for the day */
  const niftyDayChg = live.nifty?.dayChg ?? (benchmarkTrend.length > 1
    ? ((benchmarkTrend[benchmarkTrend.length - 1] - benchmarkTrend[benchmarkTrend.length - 2]) / benchmarkTrend[benchmarkTrend.length - 2]) * 100
    : 0);
  const marketMood = niftyDayChg < 0 ? 'bear' : 'neutral';

  const filtered = useMemo(() => {
    let list = holdings.filter(h => filter === 'all' ? true : h.action === filter);
    if (investorMode === 'active') {
      list = [...list].sort((a, b) => Math.abs(trends[b.id]?.dayChange ?? 0) - Math.abs(trends[a.id]?.dayChange ?? 0));
    } else {
      const order = { review: 0, watch: 1, hold: 2 };
      list = [...list].sort((a, b) => order[a.action] - order[b.action]);
    }
    return list;
  }, [holdings, filter, investorMode, trends]);

  const mood = totals.avgSentiment >= 60 ? 'positive' : totals.avgSentiment >= 45 ? 'neutral' : 'cautious';
  const filters = [['all', 'All'], ['hold', 'Looking good'], ['watch', 'Watching'], ['review', 'Needs review']];
  const periods = ['1D', '1W', '1M', '3M', 'YTD', '1Y', 'All'];
  const dockItems = [
    ['canvas', 'Canvas', Icon.canvas],
    ['today', 'Today', Icon.home],
    ['holdings', 'Holdings', Icon.list],
    ['tax', 'Tax', Icon.percent],
    ['markets', 'Markets', Icon.globe],
    ['discover', 'Discover', Icon.compass],
  ];

  return (
    <div className="min-h-screen pb-8 pl-20 relative">
      <div className={`ambience ${marketMood === 'bear' ? 'bear' : ''}`}></div>

      {/* Header — minimal, Fey-like */}
      <header className="relative z-20">
        <div className="max-w-6xl mx-auto px-5 sm:px-8 pt-5 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-7 h-7 rounded-lg surface flex items-end justify-center gap-[2.5px] pb-[6px]">
              <span className="w-[2.5px] h-[7px] rounded-full" style={{ background: 'var(--down)', opacity: .9 }}></span>
              <span className="w-[2.5px] h-[12px] rounded-full" style={{ background: 'var(--accent)' }}></span>
              <span className="w-[2.5px] h-[9px] rounded-full" style={{ background: 'var(--up)', opacity: .9 }}></span>
            </div>
            <p className="font-medium tracking-tight text-[14px]">Holdr</p>
          </div>
          <div className="flex items-center gap-2">
            <ProfileSwitcher profile={profile} profiles={profiles} onSwitch={switchProfile} onAdd={addProfile} hasLiveData={liveHoldings.length > 0} onClear={() => setLiveHoldings([])} />
            <div className="hidden md:flex surface glass-flat rounded-full p-[3px]">
              {[['longterm', 'Demo'], ['active', 'Live']].map(([key, label]) => (
                <button key={key} onClick={() => setMode(key)}
                  className="px-3 py-1 rounded-full text-[11px] font-medium transition-colors"
                  style={investorMode === key ? { background: 'var(--surface-2)', color: 'var(--text)', border: '1px solid var(--border-strong)' } : { color: 'var(--text-faint)', border: '1px solid transparent' }}>
                  {label}
                </button>
              ))}
            </div>
            <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full surface glass-flat">
              <span className="w-1 h-1 rounded-full pulse-dot" style={{
                background: live.status === 'live' ? 'var(--up)' : live.status === 'loading' ? 'var(--warn)' : 'var(--text-faint)',
                color: live.status === 'live' ? 'var(--up)' : live.status === 'loading' ? 'var(--warn)' : 'var(--text-faint)',
              }}></span>
              <span className="text-[10.5px] font-medium text-muted">
                {live.status === 'live'
                  ? <>Live · <span className="num">{live.updated && live.updated.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</span></>
                  : live.status === 'loading' ? 'Fetching live data…' : 'Demo data'}
              </span>
            </div>
          </div>
        </div>
      </header>

      <div className="mt-4">
        <TickerTape holdings={holdings} trends={trends} liveMacro={live.macro} liveNifty={live.nifty} />
      </div>

      <main className="max-w-6xl mx-auto px-5 sm:px-8 relative z-10">

        {tab === 'canvas' && (
          <CanvasView holdings={holdings} trends={trends} totals={totals} marketMood={marketMood}
            onOpen={setBento} onAdd={() => setShowAdd(true)} />
        )}

        {tab === 'today' && (
          <div className="fade-up">
            {/* editorial greeting */}
            <section className="mt-9">
              <p className="text-[12px] num text-faint">{TODAY.toLocaleDateString('en-IN', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
              <h1 className="text-[20px] font-medium tracking-tight mt-1">
                {holdings.length === 0
                  ? <>Hello, Akhil. <span style={{ color: 'var(--text-faint)' }}>Connect a broker to see your portfolio here.</span></>
                  : <>Hello, Akhil. Your portfolio is <span style={{ color: mood === 'positive' ? 'var(--up)' : mood === 'neutral' ? 'var(--warn)' : 'var(--down)' }}>{mood}</span>.</>}
              </h1>
            </section>

            {/* ① what needs attention — recap strip, full width */}
            <section className="mt-6">
              {holdings.length === 0 ? (
                <div className="surface rounded-2xl">
                  <EmptyState compact title="No recap yet" subtitle="Once your holdings are connected, you'll see a daily snapshot of what changed and what needs attention." />
                </div>
              ) : (
                <DailyRecap holdings={holdings} totals={totals} mode={investorMode} />
              )}
            </section>

            {/* ② your money + ③ what's moving it */}
            <section className="mt-3 grid lg:grid-cols-5 gap-3 items-stretch">
              {/* chart card */}
              <div className="lg:col-span-3 surface rounded-2xl overflow-hidden flex flex-col">
                {holdings.length === 0 ? (
                  <EmptyState title="Your portfolio trend will live here" subtitle="Add holdings to track performance against NIFTY 50 over time." cta="+ Add position" onCta={() => setShowAdd(true)} />
                ) : (
                  <React.Fragment>
                    <div className="p-5 pb-0">
                      <div className="flex items-baseline gap-2.5 flex-wrap">
                        <p className="text-[28px] num font-medium tracking-tight leading-none">{fmtINR(Math.round(totals.current))}</p>
                        <Delta value={totals.pnlPct} />
                        <span className="text-[11px] num text-faint">{fmtSigned(Math.round(totals.pnl))} all-time</span>
                      </div>
                      <div className="flex items-center gap-2 mt-2">
                        <Delta value={totals.alphaPeriod} />
                        <span className="text-[10.5px] text-faint">vs NIFTY 50 · invested {fmtINR(Math.round(totals.invested))}</span>
                      </div>
                    </div>
                    <div className="mt-3 flex-1">
                      <CompareChart key={period + '-' + live.status} portfolio={portfolioTrend} benchmark={benchmarkTrend} height={250} period={period} />
                    </div>
                    <div className="flex items-center justify-between px-5 py-3" style={{ borderTop: '1px solid var(--border)' }}>
                      <div className="flex items-center gap-1">
                        {periods.map(p => (
                          <button key={p} onClick={() => setPeriod(p)}
                            className="px-2 py-1 rounded-md text-[10.5px] num font-medium transition-colors"
                            style={period === p ? { background: 'var(--surface-2)', color: 'var(--text)', border: '1px solid var(--border-strong)' } : { color: 'var(--text-faint)', border: '1px solid transparent' }}>
                            {p}
                          </button>
                        ))}
                      </div>
                      <span className="text-[10.5px] text-faint hidden sm:block">
                        {totals.needsReview ? <span style={{ color: 'var(--down)' }}>{totals.needsReview} flagged</span> : 'all clear'} · {holdings.length} positions
                      </span>
                    </div>
                  </React.Fragment>
                )}
              </div>

              {/* right rail: news only */}
              <div className="lg:col-span-2 surface rounded-2xl p-5 flex flex-col min-h-0">
                {holdings.length === 0 ? (
                  <EmptyState compact title="No news yet" subtitle="News about your holdings will show up here once you've added positions." />
                ) : (
                  <React.Fragment>
                    <div className="flex items-center justify-between mb-1">
                      <p className="text-[11px] font-semibold uppercase tracking-[0.1em] text-faint">Your holdings in the news</p>
                    </div>
                    <div className="overflow-y-auto pr-1 flex-1" style={{ maxHeight: 280 }}>
                      {NEWS_FEED.map((item, i) => (
                        <NewsRow key={i} item={item} holding={holdings.find(h => h.id === item.stockId) || null} last={i === NEWS_FEED.length - 1} />
                      ))}
                    </div>
                  </React.Fragment>
                )}
              </div>
            </section>

            {/* ③ the market around you — context after your own money */}
            <section className="mt-8">
              <p className="text-[10px] uppercase tracking-[0.14em] text-faint font-semibold mb-3">The market around you</p>
              <MarketPulse liveMacro={live.macro} liveFlows={live.flows} />
            </section>
          </div>
        )}

        {tab === 'holdings' && (
          <div className="fade-up">
            <section className="mt-9 flex items-center justify-between gap-3 flex-wrap">
              <div>
                <h1 className="text-[20px] font-medium tracking-tight">Holdings</h1>
                <p className="text-[11px] num text-faint mt-1">{holdings.length === 0 ? 'no positions yet' : `${investorMode === 'active' ? 'sorted by day move' : 'sorted by attention'} · ${filtered.length} of ${holdings.length} positions`}</p>
              </div>
              <button onClick={() => setShowAdd(true)}
                className="px-3.5 py-2 rounded-full text-[12px] font-medium transition-opacity hover:opacity-90 flex items-center gap-1.5"
                style={{ background: 'var(--text)', color: 'var(--bg)' }}>
                + Add position
              </button>
            </section>

            {holdings.length === 0 && (
              <section className="mt-5 surface rounded-2xl">
                <EmptyState title="No holdings connected yet" subtitle="Add a position manually or import a broker statement to see your allocation, thesis health, movers and full position list here." cta="+ Add position" onCta={() => setShowAdd(true)} />
              </section>
            )}

            {/* insight strip — what the table can't say at a glance */}
            {holdings.length > 0 && <>
            <section className="mt-5 grid sm:grid-cols-3 gap-3">
              {/* allocation — top 5 holdings, rest grouped as "others" so the bar stays readable */}
              <div className="surface rounded-2xl p-4">
                <div className="flex items-center justify-between">
                  <p className="text-[10px] uppercase tracking-[0.1em] text-faint font-semibold">Allocation</p>
                  {(() => {
                    const top = [...holdings].sort((a, b) => b.qty * b.ltp - a.qty * a.ltp)[0];
                    const topW = (top.qty * top.ltp / totals.current) * 100;
                    return <span className="text-[10px] num text-faint">{top.symbol} · {topW.toFixed(0)}% of portfolio</span>;
                  })()}
                </div>
                {(() => {
                  const sorted = [...holdings].sort((a, b) => b.qty * b.ltp - a.qty * a.ltp);
                  const top5 = sorted.slice(0, 5);
                  const rest = sorted.slice(5);
                  const restW = rest.reduce((s, h) => s + (h.qty * h.ltp / totals.current) * 100, 0);
                  return (
                    <>
                      <div className="mt-3 h-[6px] rounded-full overflow-hidden flex gap-[2px]">
                        {top5.map(h => (
                          <div key={h.id} title={`${h.symbol} · ${((h.qty * h.ltp / totals.current) * 100).toFixed(1)}%`}
                            className="rounded-full" style={{ width: `${(h.qty * h.ltp / totals.current) * 100}%`, background: h.hue, opacity: .85 }}></div>
                        ))}
                        {rest.length > 0 && (
                          <div title={`${rest.length} more · ${restW.toFixed(1)}%`} className="rounded-full" style={{ width: `${restW}%`, background: 'var(--border-strong)' }}></div>
                        )}
                      </div>
                      <div className="mt-2.5 flex flex-wrap gap-x-3 gap-y-1">
                        {top5.map(h => (
                          <span key={h.id} className="text-[10px] text-faint flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full" style={{ background: h.hue, opacity: .85 }}></span>
                            {h.symbol} <span className="num text-muted">{((h.qty * h.ltp / totals.current) * 100).toFixed(0)}%</span>
                          </span>
                        ))}
                        {rest.length > 0 && (
                          <span className="text-[10px] text-faint flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full" style={{ background: 'var(--border-strong)' }}></span>
                            +{rest.length} more <span className="num text-muted">{restW.toFixed(0)}%</span>
                          </span>
                        )}
                      </div>
                    </>
                  );
                })()}
              </div>
              {/* sector mix — groups every holding by sector so the page scales past a handful of positions */}
              <div className="surface rounded-2xl p-4">
                {(() => {
                  const bySector = new Map();
                  holdings.forEach(h => bySector.set(h.sector, (bySector.get(h.sector) || 0) + h.qty * h.ltp));
                  const sectors = [...bySector.entries()].sort((a, b) => b[1] - a[1]);
                  const colorFor = name => HUE_PALETTE[seedFromString(name) % HUE_PALETTE.length];
                  const top5 = sectors.slice(0, 5);
                  const rest = sectors.slice(5);
                  const restW = rest.reduce((s, [, v]) => s + v, 0);
                  return (
                    <>
                      <div className="flex items-center justify-between">
                        <p className="text-[10px] uppercase tracking-[0.1em] text-faint font-semibold">Sector mix</p>
                        <span className="text-[10px] num text-faint">{sectors.length} sector{sectors.length !== 1 ? 's' : ''}</span>
                      </div>
                      <div className="mt-3 h-[6px] rounded-full overflow-hidden flex gap-[2px]">
                        {top5.map(([name, v]) => (
                          <div key={name} title={`${name} · ${((v / totals.current) * 100).toFixed(1)}%`}
                            className="rounded-full" style={{ width: `${(v / totals.current) * 100}%`, background: colorFor(name), opacity: .85 }}></div>
                        ))}
                        {rest.length > 0 && (
                          <div title={`${rest.length} more sectors · ${((restW / totals.current) * 100).toFixed(1)}%`} className="rounded-full" style={{ width: `${(restW / totals.current) * 100}%`, background: 'var(--border-strong)' }}></div>
                        )}
                      </div>
                      <div className="mt-2.5 flex flex-wrap gap-x-3 gap-y-1">
                        {top5.map(([name, v]) => (
                          <span key={name} className="text-[10px] text-faint flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full" style={{ background: colorFor(name), opacity: .85 }}></span>
                            {name} <span className="num text-muted">{((v / totals.current) * 100).toFixed(0)}%</span>
                          </span>
                        ))}
                        {rest.length > 0 && (
                          <span className="text-[10px] text-faint flex items-center gap-1">
                            <span className="w-1.5 h-1.5 rounded-full" style={{ background: 'var(--border-strong)' }}></span>
                            +{rest.length} more <span className="num text-muted">{((restW / totals.current) * 100).toFixed(0)}%</span>
                          </span>
                        )}
                      </div>
                    </>
                  );
                })()}
              </div>
              {/* movers today */}
              <div className="surface rounded-2xl p-4">
                <p className="text-[10px] uppercase tracking-[0.1em] text-faint font-semibold">Today's movers</p>
                {(() => {
                  const sorted = [...holdings].sort((a, b) => (trends[b.id]?.dayChange ?? 0) - (trends[a.id]?.dayChange ?? 0));
                  const best = sorted[0], worst = sorted[sorted.length - 1];
                  return (
                    <div className="mt-3 space-y-2">
                      {[best, worst].map((h, i) => (
                        <div key={h.id} className="flex items-center gap-2">
                          <span className="text-[9px] uppercase tracking-[0.08em] text-faint w-[30px]">{i === 0 ? 'best' : 'worst'}</span>
                          <Mark mono={h.mono} hue={h.hue} size="sm" />
                          <span className="text-[11.5px] font-medium flex-1 truncate">{h.symbol}</span>
                          <Delta value={trends[h.id]?.dayChange ?? 0} precision={2} />
                        </div>
                      ))}
                    </div>
                  );
                })()}
              </div>
            </section>

            {/* filters — directly above the table */}
            <section className="mt-5 flex items-center gap-1.5 overflow-x-auto pb-1">
              {filters.map(([key, label]) => (
                <button key={key} onClick={() => setFilter(key)}
                  className="whitespace-nowrap px-3 py-1.5 rounded-full text-[11.5px] font-medium transition-colors"
                  style={filter === key ? { background: 'var(--text)', color: 'var(--bg)' } : { background: 'var(--surface)', color: 'var(--text-muted)', border: '1px solid var(--border)' }}>
                  {label}
                  {key !== 'all' && <span className="num text-[10px] ml-1.5 opacity-70">{holdings.filter(h => h.action === key).length}</span>}
                </button>
              ))}
            </section>

            <section className="mt-3 surface rounded-2xl overflow-hidden">
              <div className="hidden sm:flex items-center gap-4 px-4 py-2.5 text-[9px] uppercase tracking-[0.1em] text-faint font-semibold" style={{ borderBottom: '1px solid var(--border)' }}>
                <div className="w-[44%] sm:w-[26%]">Position</div>
                <div className="hidden md:block w-[13%]">Trend</div>
                <div className="hidden sm:block w-[17%]">Price / Day</div>
                <div className="flex-1 sm:flex-none sm:w-[17%]">P&amp;L</div>
                <div className="hidden lg:block w-[11%]">vs NIFTY</div>
                <div className="hidden xl:block w-[16%] text-right">Sector</div>
                <div className="w-3.5"></div>
              </div>
              {filtered.map(h => (
                <HoldingRow key={h.id} h={{ ...h, _dayChange: trends[h.id].dayChange }} trend={trends[h.id].series} onOpen={setActive} />
              ))}
              {filtered.length === 0 && (
                <div className="text-center py-16 text-faint"><p className="text-[12.5px]">Nothing in this view — try another filter.</p></div>
              )}
            </section>
            </>}

          </div>
        )}

        {tab === 'tax' && (
          <div className="fade-up">
            <section className="mt-9 mb-4">
              <h1 className="text-[20px] font-medium tracking-tight">Tax</h1>
              <p className="text-[11.5px] text-faint mt-1">Indicative planning numbers — confirm with a tax professional before acting.</p>
            </section>
            {holdings.length === 0 ? (
              <section className="surface rounded-2xl">
                <EmptyState title="No tax data yet" subtitle="Holding periods, gains and tax-saving windows will show up here once you've added positions." cta="+ Add position" onCta={() => setShowAdd(true)} />
              </section>
            ) : (
              <TaxView holdings={holdings} />
            )}
          </div>
        )}

        {tab === 'markets' && (
          <div className="fade-up">
            <section className="mt-9 mb-4">
              <h1 className="text-[20px] font-medium tracking-tight">Markets</h1>
              <p className="text-[11.5px] text-faint mt-1">Currencies, commodities, and who's buying vs selling.</p>
            </section>
            <MarketsView liveMacro={live.macro} liveFlows={live.flows} />
          </div>
        )}

        {tab === 'discover' && (
          <div className="fade-up">
            <section className="mt-9 mb-4">
              <h1 className="text-[20px] font-medium tracking-tight">Discover</h1>
              <p className="text-[11.5px] text-faint mt-1">What's moving in the market, mapped against what you hold.</p>
            </section>
            <DiscoverView holdings={holdings} />
          </div>
        )}
      </main>

      {/* floating dock */}
      <nav className="dock">
        {dockItems.map(([key, label, Ic]) => (
          <button key={key} onClick={() => setTab(key)} className={`dock-btn ${tab === key ? 'active' : ''}`}>
            <Ic />
            <span className="dock-label glass-pop">{label}</span>
          </button>
        ))}
        <div className="dock-sep"></div>
        <button onClick={() => setShowAdd(true)} className="dock-btn">
          <Icon.plus />
          <span className="dock-label glass-pop">Add holding</span>
        </button>
        <button onClick={() => setTheme(theme === 'glass' ? 'flat' : 'glass')} className="dock-btn">
          {theme === 'glass' ? <Icon.moon /> : <Icon.sun />}
          <span className="dock-label glass-pop">{theme === 'glass' ? 'Dark mode' : 'Glass mode'}</span>
        </button>
      </nav>

      {active && <HoldingDetail h={active} trend={trends[active.id]?.series || genTrend(active.id, active.ltp)} onClose={() => setActive(null)} />}
      {bento && <StockBento h={bento} trend={trends[bento.id]?.series || genTrend(bento.id, bento.ltp)}
        dayChange={trends[bento.id]?.dayChange} period={period} onClose={() => setBento(null)} />}
      {showAdd && <AddHoldingModal onClose={() => setShowAdd(false)} onAdd={handleAdd} />}

      {toast && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[70] text-[12px] font-medium px-4 py-2.5 rounded-full shadow-2xl fade-up"
          style={{ background: 'var(--text)', color: 'var(--bg)' }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
