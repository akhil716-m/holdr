/* tiny CSV parser — handles quoted fields with embedded commas/newlines, returns raw rows */
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.some(v => v.trim() !== '')) rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); if (row.some(v => v.trim() !== '')) rows.push(row); }
  return rows;
}

function normalizeHeader(h) { return String(h).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function findCol(headers, aliases) {
  const normalized = headers.map(normalizeHeader);
  for (const alias of aliases) {
    const idx = normalized.indexOf(alias);
    if (idx !== -1) return headers[idx];
  }
  for (const alias of aliases) {
    const idx = normalized.findIndex(h => h.includes(alias));
    if (idx !== -1) return headers[idx];
  }
  return null;
}

/* broker exports (esp. Zerodha P&L reports) have a few title/summary rows before the real
   table — scan for the row that actually looks like a header row (has symbol + qty columns) */
function tableFromRows(rows) {
  for (let i = 0; i < rows.length; i++) {
    const cells = rows[i].map(c => String(c ?? '').trim());
    const hasId = findCol(cells, COLUMN_ALIASES.symbol) || findCol(cells, COLUMN_ALIASES.name) || findCol(cells, COLUMN_ALIASES.isin);
    if (hasId && findCol(cells, COLUMN_ALIASES.qty)) {
      const headers = cells;
      const table = rows.slice(i + 1).map(r => {
        const obj = {};
        headers.forEach((h, j) => obj[h] = String(r[j] ?? '').trim());
        return obj;
      });
      return { headers, table };
    }
  }
  throw new Error("Couldn't find a holdings table in this file.");
}

function buildHolding(symbolRaw, qty, avgPrice, ltp, nameRaw) {
  let symbol = String(symbolRaw).trim().toUpperCase();
  let id = symbol.toLowerCase().replace(/[^a-z0-9]/g, '');
  let displayName = null;
  /* ISIN codes (e.g. INE848E01016) aren't human-readable — if the file also gave us a company
     name, derive a ticker-like symbol from it and keep the ISIN only as the internal id */
  if (ISIN_RE.test(symbol) && nameRaw) {
    displayName = nameRaw.trim();
    id = symbol.toLowerCase();
    symbol = displayName.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10) || symbol;
  }
  const info = STOCK_INFO[symbol];
  const hue = info?.hue || HUE_PALETTE[seedFromString(symbol) % HUE_PALETTE.length];
  const mono = info?.mono || symbol.slice(0, 2);
  const safeAvg = avgPrice || ltp || 0;
  const safeLtp = ltp || avgPrice || 0;
  return {
    id,
    symbol, name: info?.name || displayName || symbol, mono, hue,
    qty, avgPrice: safeAvg, ltp: safeLtp,
    sector: info?.sector || 'Diversified', buyDate: TODAY.toISOString().slice(0, 10),
    sentiment: 'neutral', sentimentScore: 50, alpha: safeAvg ? Math.round(((safeLtp - safeAvg) / safeAvg) * 1000) / 10 : 0,
    thesis: 'Imported from your statement — add a note about why you hold this.',
    thesisStatus: 'intact',
    news: [{ tag: 'Update', text: `Tracking ${symbol} — fresh news will appear here as it breaks.`, time: 'just now' }],
    events: [{ label: 'Next earnings window', date: 'TBA', type: 'earnings' }],
    action: 'watch',
  };
}

/* turns parsed table rows into holding objects, mapping broker column names onto our schema.
   handles both single-row holdings exports and multi-row P&L reports (one row per buy/sell lot,
   aggregated per symbol — avg price is derived from total buy value / total quantity) */
function rowsToHoldings(headers, table) {
  const cols = {
    symbol: findCol(headers, COLUMN_ALIASES.symbol),
    name: findCol(headers, COLUMN_ALIASES.name),
    isin: findCol(headers, COLUMN_ALIASES.isin),
    qty: findCol(headers, COLUMN_ALIASES.qty),
    avgPrice: findCol(headers, COLUMN_ALIASES.avgPrice),
    ltp: findCol(headers, COLUMN_ALIASES.ltp),
    buyValue: findCol(headers, COLUMN_ALIASES.buyValue),
  };
  const idCol = cols.symbol || cols.name || cols.isin;
  if (!idCol || !cols.qty) {
    throw new Error("Couldn't find symbol and quantity columns in this file.");
  }
  const agg = new Map();
  for (const row of table) {
    const symbolRaw = row[idCol];
    const qty = Math.abs(parseFloat(String(row[cols.qty]).replace(/,/g, '')));
    if (!symbolRaw || !qty || isNaN(qty)) continue;
    const symbol = symbolRaw.trim().toUpperCase();
    if (!symbol || symbol.length > 24) continue;
    const nameRaw = cols.name && idCol !== cols.name ? row[cols.name] : null;
    const avgPriceCell = cols.avgPrice ? parseFloat(String(row[cols.avgPrice]).replace(/,/g, '')) : NaN;
    const buyValueCell = cols.buyValue ? parseFloat(String(row[cols.buyValue]).replace(/,/g, '')) : NaN;
    const ltpCell = cols.ltp ? parseFloat(String(row[cols.ltp]).replace(/,/g, '')) : NaN;
    const buyValue = !isNaN(avgPriceCell) ? avgPriceCell * qty : (!isNaN(buyValueCell) ? buyValueCell : 0);
    const entry = agg.get(symbol) || { qty: 0, buyValue: 0, ltp: 0, name: nameRaw };
    entry.qty += qty;
    entry.buyValue += buyValue;
    if (!isNaN(ltpCell)) entry.ltp = ltpCell;
    if (!entry.name && nameRaw) entry.name = nameRaw;
    agg.set(symbol, entry);
  }
  const holdings = [];
  for (const [symbol, e] of agg) {
    if (!e.qty) continue;
    const avgPrice = e.buyValue ? Math.round((e.buyValue / e.qty) * 100) / 100 : 0;
    holdings.push(buildHolding(symbol, Math.round(e.qty * 100) / 100, avgPrice, e.ltp || 0, e.name));
  }
  if (!holdings.length) throw new Error('No valid holdings found in this file.');
  return holdings;
}

/* reads a CSV / XLSX file and returns an array of holding objects */
function parsePortfolioFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv') {
    return file.text().then(text => {
      const rows = parseCSV(text);
      try {
        const { headers, table } = tableFromRows(rows);
        return rowsToHoldings(headers, table);
      } catch (e) {
        e.debug = rows.slice(0, 8).map(r => r.join(' | ')).join('\n');
        throw e;
      }
    });
  }
  if (ext === 'xlsx' || ext === 'xls') {
    return file.arrayBuffer().then(buf => {
      const wb = XLSX.read(buf, { type: 'array' });
      const sheetRows = wb.SheetNames.map(name => [name, XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: false, defval: '' })]);
      for (const [, rows] of sheetRows) {
        try {
          const { headers, table } = tableFromRows(rows);
          return rowsToHoldings(headers, table);
        } catch (e) { /* try next sheet */ }
      }
      const err = new Error("Couldn't find a holdings table in this file.");
      err.debug = sheetRows.map(([name, rows]) =>
        `Sheet "${name}":\n` + rows.slice(0, 8).map(r => r.join(' | ')).join('\n')
      ).join('\n\n');
      throw err;
    });
  }
  return Promise.reject(new Error('Unsupported file type — please upload a CSV or XLSX file.'));
}

/* institutional flows — who's buying, who's selling (₹ crore, gross + net) */
/* synthetic FII/DII activity history for demo mode — deterministic, weekdays only */
function genFlowHistory(days = 20) {
  const rnd = seedRandom(seedFromString('fii-dii-flows'));
  const out = [];
  let d = new Date(TODAY);
  while (out.length < days) {
    if (d.getDay() !== 0 && d.getDay() !== 6) {
      const fBuy = 9000 + rnd() * 7000, fSell = 9000 + rnd() * 7000;
      const dBuy = 11000 + rnd() * 8000, dSell = 9000 + rnd() * 7000;
      out.unshift({
        date: new Date(d),
        fii: { buy: fBuy, sell: fSell, net: fBuy - fSell },
        dii: { buy: dBuy, sell: dSell, net: dBuy - dSell },
      });
    }
    d = new Date(d.getTime() - 86400000);
  }
  return out;
}
const DEMO_FLOW_HISTORY = genFlowHistory(20);

/* fetch real FII/DII from NSE via the local bridge; accumulate a rolling
   history in localStorage so the activity chart/table become real over time */
async function fetchFlows() {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 7000);
    const res = await fetch('http://localhost:8765/nse/fiidii', { signal: ctrl.signal });
    clearTimeout(t);
    if (!res.ok) return null;
    const rows = await res.json();
    const fii = rows.find(r => /FII|FPI/i.test(r.category));
    const dii = rows.find(r => /DII/i.test(r.category));
    if (!fii || !dii) return null;
    const toNum = v => Math.round(parseFloat(v)) || 0;
    const entry = {
      fii: { buy: toNum(fii.buyValue), sell: toNum(fii.sellValue), net: toNum(fii.netValue) },
      dii: { buy: toNum(dii.buyValue), sell: toNum(dii.sellValue), net: toNum(dii.netValue) },
    };
    const hist = JSON.parse(localStorage.getItem('holdr-flows') || '{}');
    hist[fii.date] = entry;
    const keep = Object.entries(hist).sort((a, b) => new Date(a[0]) - new Date(b[0])).slice(-20);
    localStorage.setItem('holdr-flows', JSON.stringify(Object.fromEntries(keep)));
    const history = keep.map(([date, v]) => ({ date: new Date(date), fii: v.fii, dii: v.dii }));
    return history.length >= 2 ? history : null;
  } catch (e) { return null; }
}

/* ========================== SEEDED TRENDS ================================== */
function seedFromString(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h) || 1; }
function seedRandom(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function genTrend(seedStr, end, points = 26, biasUp = true) {
  const rnd = seedRandom(seedFromString(seedStr));
  let val = end * (biasUp ? (0.90 + rnd() * 0.05) : (1.05 + rnd() * 0.06));
  const arr = [val];
  for (let i = 1; i < points; i++) {
    const pull = (end - val) / (points - i) * 0.55;
    const noise = (rnd() - 0.5) * end * 0.022;
    val = val + pull + noise;
    arr.push(val);
  }
  arr[arr.length - 1] = end;
  return arr;
}

/* two dark variants: 'glass' (default, frosted surfaces) and 'flat' (solid, no blur) */
function useTheme() {
  const [theme, setTheme] = useState(() => localStorage.getItem('holdr-theme') || 'glass');
  useEffect(() => {
    document.documentElement.classList.toggle('flat', theme === 'flat');
    localStorage.setItem('holdr-theme', theme);
  }, [theme]);
  return [theme, setTheme];
}

/* ruler-style x-axis: a dense row of minor ticks plus sparse labelled major ticks
   (month boundaries, or weekdays for short periods) */
function buildAxisTicks(n, dateAt, totalDays) {
  const minorCount = Math.min(n, 60);
  const minors = [...new Set(Array.from({ length: minorCount }, (_, k) => Math.round((k / (minorCount - 1)) * (n - 1))))];

  let majors = [];
  if (totalDays <= 7) {
    majors = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(f * (n - 1)))
      .map(i => ({ i, label: dateAt(i).toLocaleDateString('en-IN', { weekday: 'short' }) }));
  } else {
    for (let i = 0; i < n; i++) {
      const d = dateAt(i);
      if (d.getDate() === 1 || i === 0) {
        majors.push({ i, label: d.getMonth() === 0 ? `'${String(d.getFullYear()).slice(2)}` : d.toLocaleDateString('en-IN', { month: 'short' }) });
      }
    }
    if (majors.length < 2) {
      majors = [0, n - 1].map(i => ({ i, label: dateAt(i).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) }));
    }
  }
  return { minors, majors: [...new Map(majors.map(m => [m.i, m])).values()] };
}

/* AxisRuler: minor tick row + labelled major ticks, drawn along the chart's x-axis line */
function AxisRuler({ x, y, height, n, dateAt, totalDays }) {
  const { minors, majors } = buildAxisTicks(n, dateAt, totalDays);
  return (
    <>
      {minors.map((mi, k) => (
        <line key={`min-${k}`} x1={x(mi)} x2={x(mi)} y1={y} y2={y + 5} stroke="var(--border)" strokeWidth="1" />
      ))}
      {majors.map((m, k) => (
        <g key={`maj-${k}`}>
          <line x1={x(m.i)} x2={x(m.i)} y1={y} y2={y + 8} stroke="var(--border-strong)" strokeWidth="1" />
          <text x={x(m.i)} y={height - 4}
            textAnchor={m.i === 0 ? 'start' : m.i === n - 1 ? 'end' : 'middle'}
            fontSize="9" fill="var(--text-muted)" fontFamily="JetBrains Mono, monospace">{m.label}</text>
        </g>
      ))}
    </>
  );
}

}

/* limit concurrency so the proxy/Yahoo don't rate-limit a 12-request burst */

  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const idx = i++; out[idx] = await fn(items[idx], idx); }
  }));
  return out;
}

const dstr = d => d.toISOString().slice(0, 10);
async function upstoxJSON(path) {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 6000);
    const res = await fetch(UPSTOX_BASE + path, { signal: ctrl.signal });
    clearTimeout(t);

async function fetchUpstoxChart(symKey, period) {
  const k = UPSTOX_KEYS[symKey];
  if (!k) return null;
  const cfg = UPSTOX_PERIOD[period] || UPSTOX_PERIOD['1M'];
  const enc = encodeURIComponent(k);
  let data;
  if (cfg.kind === 'intraday') {
    data = await upstoxJSON(`/api/v2/historical-candle/intraday/${enc}/${cfg.interval}`);
  } else {
    const now = new Date();
    data = await upstoxJSON(`/api/v2/historical-candle/${enc}/${cfg.interval}/${dstr(now)}/${dstr(new Date(now.getTime() - cfg.days * 86400000))}`);
  }
  const candles = data && data.candles;
  if (!candles || candles.length < 2) return null;
  const closes = candles.map(c => c[4]).reverse(); // Upstox returns newest first
  const price = closes[closes.length - 1];
  let dayPrev;
  if (cfg.interval === 'day' || cfg.interval === 'week') {
    dayPrev = closes[closes.length - 2];
  } else {
    /* intraday series — get yesterday's close from daily candles */
    const d = await upstoxJSON(`/api/v2/historical-candle/${enc}/day/${dstr(new Date())}/${dstr(new Date(Date.now() - 6 * 86400000))}`);
    const dc = d && d.candles;
    if (dc && dc.length) {
      const newestIsToday = new Date(dc[0][0]).toDateString() === new Date().toDateString();
      dayPrev = newestIsToday && dc.length > 1 ? dc[1][4] : dc[0][4];
    } else dayPrev = closes[0];
  }
  return { price, closes, dayChg: ((price - dayPrev) / dayPrev) * 100, src: 'upstox' };
}

function Sparkline({ data, id, width = 96, height = 28, mono = true, positive = true }) {
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const stepX = width / (data.length - 1);
  const pts = data.map((d, i) => [i * stepX, height - ((d - min) / range) * (height - 4) - 2]);
  const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const color = mono ? 'var(--chart-grey)' : (positive ? 'var(--up)' : 'var(--down)');
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible shrink-0">
      <path d={line} fill="none" stroke={color} strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={pts[pts.length-1][0]} cy={pts[pts.length-1][1]} r="2" fill={color} />
    </svg>
  );
}

/* single-series interactive line chart — hover crosshair, x-axis, tooltip */
function LineChart({ data, period, fmt, height = 190, accent = 'var(--chart-line)' }) {
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);
  const uid = useId();
  /* padX = 0 so the plot edges line up with the card content (tiles, title) —
     the viewBox is stretched, which would inflate any nonzero inset */
  const width = 820, padX = 0, padTop = 14, axisH = 22;
  const h = height - padTop - axisH;
  const innerW = width - padX * 2;
  const n = data.length;
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const x = i => padX + (i / (n - 1)) * innerW;
  const y = v => padTop + (h - ((v - min) / range) * h);
  const line = data.map((v, i) => (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const area = `${line} L ${x(n - 1)},${padTop + h} L ${padX},${padTop + h} Z`;
  const up = data[n - 1] >= data[0];
  const col = accent === 'auto' ? (up ? 'var(--up)' : 'var(--down)') : accent;

  const totalDays = PERIOD_DAYS[period] || 30;
  const dateAt = i => new Date(TODAY.getTime() - totalDays * 86400000 * (1 - i / (n - 1)));
  const fmtDate = d => totalDays <= 7
    ? d.toLocaleDateString('en-IN', { weekday: 'short' })
    : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', ...(totalDays > 365 ? { year: '2-digit' } : {}) });

  const onMove = e => {
    const rect = wrapRef.current.getBoundingClientRect();
    const i = Math.round((((e.clientX - rect.left) / rect.width * width) - padX) / innerW * (n - 1));
    setHover(Math.max(0, Math.min(n - 1, i)));
  };
  const hv = hover !== null ? hover : null;

  return (
    <div ref={wrapRef} className="relative w-full" style={{ height }} onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
      <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="relative w-full h-full" style={{ overflow: 'visible' }}>
        <defs>
          <linearGradient id={`line-grad-${uid}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={col} stopOpacity="0.32" />
            <stop offset="55%" stopColor={col} stopOpacity="0.08" />
            <stop offset="100%" stopColor={col} stopOpacity="0" />
          </linearGradient>
          <pattern id={`dots-${uid}`} width="9" height="9" patternUnits="userSpaceOnUse">
            <circle cx="1.3" cy="1.3" r="0.9" fill="var(--dot)" />
          </pattern>
          <clipPath id={`area-clip-${uid}`}>
            <path d={area} />
          </clipPath>
        </defs>
        <line x1={padX} x2={width - padX} y1={padTop + h} y2={padTop + h} stroke="var(--border)" strokeWidth="1" />
        <AxisRuler x={x} y={padTop + h} height={height} n={n} dateAt={dateAt} totalDays={totalDays} />
        <rect x={padX} y={padTop} width={innerW} height={h} fill={`url(#dots-${uid})`} clipPath={`url(#area-clip-${uid})`} className="fade-in-slow" />
        <path d={area} fill={`url(#line-grad-${uid})`} stroke="none" className="fade-in-slow" />
        <path d={line} fill="none" stroke={col} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" className="draw-line" />
        {hv !== null ? (
          <g>
            <line x1={x(hv)} x2={x(hv)} y1={padTop} y2={padTop + h} stroke="var(--border-strong)" strokeWidth="1" />
            <circle cx={x(hv)} cy={y(data[hv])} r="3.5" fill={col} stroke="var(--surface)" strokeWidth="1.5" />
          </g>
        ) : (
          <circle cx={x(n - 1)} cy={y(data[n - 1])} r="3" fill={col} />
        )}
      </svg>
      {hv !== null && (
        <div className="absolute pointer-events-none z-10 rounded-lg px-2.5 py-1.5 shadow-xl glass-pop"
          style={{ left: `${(x(hv) / width) * 100}%`, top: 2,
            transform: hv > n / 2 ? 'translateX(calc(-100% - 8px))' : 'translateX(8px)',
            border: '1px solid var(--border-strong)' }}>
          <p className="text-[9px] num text-faint whitespace-nowrap">{fmtDate(dateAt(hv))}</p>
          <p className="text-[12px] num font-medium whitespace-nowrap mt-0.5">{fmt(data[hv])}</p>
        </div>
      )}
      {hv !== null && (
        <HoverDatePill leftPct={(x(hv) / width) * 100} topPct={((padTop + h) / height) * 100} label={fmtDate(dateAt(hv))} />
      )}
    </div>
  );
}

/* fetch a macro instrument's series at a period, converted to display units */
async function fetchMacroSeries(id, period, inr) {
  const sym = (MACRO_SYMBOLS.find(([k]) => k === id) || [])[1];
  if (!sym) return null;
  const { range, interval } = PERIOD_API[period] || PERIOD_API['1M'];
  const q = await fetchChart(sym, range, interval);
  if (!q) return null;
  const conv = id === 'gold' ? v => v * inr / OZ_GRAMS * 10
    : id === 'silver' ? v => v * inr / OZ_GRAMS * 1000
    : v => v;
  return { closes: q.closes.map(conv), price: conv(q.price), chg: q.dayChg };
}
const macroFmt = id => v =>
  id === 'usdinr' ? '₹' + v.toFixed(2)
  : id === 'gold' ? '₹' + Math.round(v).toLocaleString('en-IN') + '/10g'
  : id === 'silver' ? '₹' + Math.round(v).toLocaleString('en-IN') + '/kg'
  : id === 'crude' ? '$' + v.toFixed(1)
  : v.toFixed(1);

/* macro tiles + FII/DII flows — the forces behind today's mood */
function MacroExplorer({ macro, inr }) {
  const [sel, setSel] = useState('gold');
  const [period, setPeriod] = useState('1M');
  const [cache, setCache] = useState({});
  const periods = ['1W', '1M', '3M', '1Y', 'All'];
  const cur = macro.find(m => m.id === sel) || macro[0];
  const key = sel + period;

  useEffect(() => {
    if (cache[key]) return;
    let cancelled = false;
    fetchMacroSeries(sel, period, inr).then(r => {
      if (!cancelled && r && r.closes.length > 2) setCache(c => ({ ...c, [key]: r.closes }));
    });
    return () => { cancelled = true; };
  }, [key, inr]);

  const series = cache[key]
    || (cur.closes && cur.closes.length > 2 && period === '1M' ? cur.closes : null)
    || genTrend('macro-' + sel, parseFloat(cur.value.replace(/[^0-9.]/g, '')) || 100, 26, cur.chg >= 0);
  const periodChg = series.length > 1 ? ((series[series.length - 1] - series[0]) / series[0]) * 100 : 0;

              style={on ? { background: 'var(--surface-2)', border: '1px solid var(--border-strong)' } : { border: '1px solid var(--border)' }}>
              <div className="flex items-center justify-between">
                <p className="text-[9.5px] uppercase tracking-[0.1em] text-faint font-semibold">{m.label}</p>
                <Delta value={m.chg} precision={2} />

              <p className="text-[18px] num font-medium whitespace-nowrap mt-1.5">{m.value}<span className="text-[9.5px] text-faint ml-0.5">{m.unit || ''}</span></p>
            </button>

            {periods.map(p => (
              <button key={p} onClick={() => setPeriod(p)}

                style={period === p ? { background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--border-strong)' } : { color: 'var(--text-faint)', border: '1px solid transparent' }}>
                {p}

            ))}
          </div>
        </div>
        <div className="mt-3">
          <LineChart key={key} data={series} period={period} fmt={macroFmt(sel)} accent="auto" height={200} />
        </div>
        {/* summary write-up */}

            <svg width="12" height="12" viewBox="0 0 15 15" fill="none" className="text-faint shrink-0"><circle cx="7.5" cy="7.5" r="6" stroke="currentColor"/><path d="M7.5 6.5v4M7.5 4.5v.5" stroke="currentColor" strokeLinecap="round"/></svg>

/* merge live macro values over the demo defaults; notes stay curated */
function mergeMacro(liveMacro = {}) {
  const MERGED = MARKET_INFLUENCES.map(m => {
    const q = liveMacro[m.id];
    return q ? { ...m, value: q.display || m.value, chg: q.chg, closes: q.closes, unit: q.display ? (m.id === 'gold' ? '/10g' : m.id === 'silver' ? '/kg' : '') : m.unit } : m;
  });
  const macro = MERGED.filter(m => m.id !== 'vix');
  const vix = MERGED.find(m => m.id === 'vix');
  const inrRate = parseFloat((MERGED.find(m => m.id === 'usdinr')?.value || '83').replace(/[^0-9.]/g, '')) || 83;
  return { macro, vix, inrRate };
}

function MarketPulse({ liveMacro = {}, liveFlows = null }) {

function TickerTape({ holdings, trends, liveMacro = {}, liveNifty = null }) {
  const holdingItems = holdings.map(h => ({
    key: h.id, label: h.symbol, value: fmtINR(h.ltp), change: trends[h.id]?.dayChange ?? 0,

  const niftyChg = liveNifty?.dayChg ?? +0.4;

  const macroItems = MARKET_INFLUENCES.map(m => {

    return { key: m.id, label: m.label, value: (q?.display || m.value) + (m.unit || ''), change: q ? q.chg : m.chg };

  const items = [...indexItems, ...holdingItems, ...macroItems];
  const strip = [...items, ...items]; // duplicated for seamless loop
  return (

  );
}

/* full-width recap strip — four visual tiles, one fact each */
function DailyRecap({ holdings, totals, mode }) {
  const flagged = holdings.filter(h => h.action === 'review');
  const maturing = holdings.map(h => ({ h, t: taxInfo(h) })).filter(x => !x.t.isLT && x.t.daysToLT <= 90).sort((a, b) => a.t.daysToLT - b.t.daysToLT);
  const mat = maturing[0];
  const hdfc = holdings.find(h => h.id === 'hdfc');
  const up = totals.pnlPct >= 0;
  const ahead = totals.alphaPeriod >= 0;

  return (
    <div className="surface rounded-2xl px-5 py-4">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2">

      <div className="grid grid-cols-2 lg:grid-cols-5">
        {/* performance — the race, told as two labeled bars + a verdict */}
        {(() => {

          const niftyPct = totals.pnlPct - totals.alphaPeriod;
          const maxAbs = Math.max(Math.abs(youPct), Math.abs(niftyPct)) || 1;
          const barW = v => Math.max(8, (Math.abs(v) / maxAbs) * 92);
          const Row = ({ label, v, you }) => (
            <div className="flex items-center gap-2">
              <span className="text-[9px] num text-faint w-[34px] shrink-0">{label}</span>
              <span className="h-[5px] rounded-full shrink-0" style={{

            <div className="px-4 first:pl-0 py-2 lg:col-span-2">
              <p className="text-[13px] font-medium leading-none">
                {ahead ? 'Beating the market' : 'Trailing the market'}
                <span className="num ml-1.5" style={{ color: ahead ? 'var(--up)' : 'var(--warn)' }}>{ahead ? '+' : '−'}{Math.abs(totals.alphaPeriod).toFixed(1)}%</span>
              </p>
              <div className="mt-3 space-y-2 max-w-[260px]">
                <Row label="you" v={youPct} you />
                <Row label="NIFTY" v={niftyPct} />

        })()}

        {/* flagged theses */}
        <div className="flex items-center gap-3.5 px-4 py-2" style={{ borderLeft: '1px solid var(--border)' }}>
          <div className="flex -space-x-2 shrink-0">

          <div className="min-w-0">
            <p className="text-[13px] font-medium leading-none flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: flagged.some(h => h.thesisStatus === 'broken') ? 'var(--down)' : 'var(--warn)' }}></span>

              {flagged.map((h, i) => <React.Fragment key={h.id}>{i > 0 && <br/>}{h.symbol} · thesis <span style={{ color: h.thesisStatus === 'broken' ? 'var(--down)' : 'var(--warn)' }}>{h.thesisStatus}</span></React.Fragment>)}

        {/* tax countdown ring */}
        {mat && (
          <div className="flex items-center gap-3.5 px-4 py-2" style={{ borderLeft: '1px solid var(--border)' }}>
            <div className="relative shrink-0" style={{ width: 44, height: 44 }}>
              <svg width="44" height="44" viewBox="0 0 44 44">
                <circle cx="22" cy="22" r="18" fill="none" stroke="var(--border)" strokeWidth="3" />
                <circle cx="22" cy="22" r="18" fill="none" stroke="var(--accent)" strokeWidth="3" strokeLinecap="round"
                  strokeDasharray={`${(Math.min(mat.t.heldDays, 365) / 365) * 113} 113`} transform="rotate(-90 22 22)" />
              </svg>
              <span className="absolute inset-0 flex items-center justify-center text-[9px] num font-medium">{mat.t.daysToLT}d</span>
            </div>
            <div className="min-w-0">
              <p className="text-[13px] font-medium leading-none flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: mat.t.daysToLT <= 14 ? 'var(--warn)' : 'var(--accent)' }}></span>
                {mat.h.symbol}
              </p>
              <p className="text-[10.5px] text-muted leading-[1.5] mt-1.5">turns long-term<br/>tax <span className="num">20% → <span style={{ color: 'var(--up)' }}>12.5%</span></span></p>
            </div>

        {hdfc && (
          <div className="flex items-center gap-3.5 px-4 py-2" style={{ borderLeft: '1px solid var(--border)' }}>
            <div className="shrink-0 w-[44px] rounded-lg overflow-hidden text-center" style={{ border: '1px solid var(--border-strong)' }}>
              <p className="text-[7.5px] font-semibold uppercase tracking-[0.1em] py-[3px]" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>Jun</p>

            <div className="min-w-0">

}

/* ============================ HOLDING ROW ================================== */
function HoldingRow({ h, onOpen, trend }) {
  const invested = h.qty * h.avgPrice;
  const current = h.qty * h.ltp;
  const pnl = current - invested;
  const pnlPct = (pnl / invested) * 100;
  const positive = pnl >= 0;

  return (
    <button onClick={() => onOpen(h)}
      className="group w-full flex items-center gap-4 px-4 py-3.5 text-left hov"
      style={{ borderBottom: '1px solid var(--border)' }}>
      <div className="flex items-center gap-3 min-w-0 w-[44%] sm:w-[26%]">
        <Mark mono={h.mono} hue={h.hue} />
        <div className="min-w-0">
          <p className="font-medium text-[13px] tracking-tight truncate">{h.symbol}</p>
          <p className="text-[10.5px] text-faint truncate num mt-[1px]">{h.qty} × {fmtINR(h.avgPrice)}</p>
        </div>
      </div>

      <div className="hidden md:flex items-center w-[13%]">
        <Sparkline data={trend} id={h.id} width={88} height={26} />
      </div>

      <div className="hidden sm:flex items-center gap-2 w-[17%]">
        <span className="text-[12.5px] num">{fmtINR(h.ltp)}</span>
        <Delta value={h._dayChange} precision={2} />
      </div>

      <div className="flex-1 sm:flex-none sm:w-[17%] flex items-center justify-end sm:justify-start gap-2">
        <span className="text-[12.5px] num font-medium" style={{ color: positive ? 'var(--up)' : 'var(--down)' }}>{fmtSigned(Math.round(pnl))}</span>
        <Delta value={pnlPct} />
      </div>

      <div className="hidden lg:flex items-center w-[11%]">

      <div className="hidden xl:block w-[16%] text-right">

      <span className="text-faint group-hover:translate-x-0.5 transition-transform shrink-0"><Icon.chevron /></span>
    </button>
  );
}

/* ============================== TAX VIEW =================================== */
function TaxView({ holdings }) {
  const rows = holdings.map(h => ({ h, t: taxInfo(h) }));
  const ltGain = rows.filter(r => r.t.isLT && r.t.gain > 0).reduce((a, r) => a + r.t.gain, 0);
  const stGain = rows.filter(r => !r.t.isLT && r.t.gain > 0).reduce((a, r) => a + r.t.gain, 0);
  const losses = rows.filter(r => r.t.gain < 0).reduce((a, r) => a + r.t.gain, 0);
  const ltTaxable = Math.max(0, ltGain - LTCG_EXEMPTION);
  const ltTax = ltTaxable * LTCG_RATE;
  const stTax = stGain * STCG_RATE;
  const totalTax = ltTax + stTax;
  const netGain = ltGain + stGain + losses;
  const harvestables = rows.filter(r => r.t.gain < 0);
  const exemptionUsed = Math.min(ltGain, LTCG_EXEMPTION);
  const exemptionLeft = LTCG_EXEMPTION - exemptionUsed;
  const stLosses = harvestables.filter(r => !r.t.isLT).reduce((a, r) => a + r.t.gain, 0);
  const harvestSaving = Math.min(Math.abs(stLosses), stGain) * STCG_RATE;

  /* smart moves — turn state into actions, ranked by rupee impact */
  const moves = [];
  if (ltGain > 0 && ltTaxable === 0) {
    moves.push({ tone: 'up', save: null,
      head: 'Your long-term gains are fully tax-free',
      body: 'Selling long-term winners today costs zero tax.',
      stocks: rows.filter(r => r.t.isLT && r.t.gain > 0).map(r => r.h),
      visual: { type: 'meter', used: exemptionUsed, total: LTCG_EXEMPTION } });
  }
  rows.filter(r => !r.t.isLT && r.t.gain > 0).forEach(({ h, t }) => {
    const save = t.gain * (STCG_RATE - LTCG_RATE);
    moves.push({ tone: 'warn', save,
      head: `Hold ${h.symbol} ${t.daysToLT} more days`,
      body: `Its ${fmtINR(Math.round(t.gain))} gain turns long-term on ${ltDate(h)}.`,
      stocks: [h],
      visual: { type: 'ring', held: t.heldDays, days: t.daysToLT } });
  });
  if (stLosses < 0 && stGain > 0) {
    const names = harvestables.filter(r => !r.t.isLT).map(r => r.h.symbol).join(' + ');
    moves.push({ tone: 'accent', save: harvestSaving,
      head: `Pair ${names} losses against your ST gains`,
      body: 'Booked losses cancel taxable gains rupee-for-rupee.',
      stocks: harvestables.filter(r => !r.t.isLT).map(r => r.h),
      visual: { type: 'pair', loss: Math.abs(stLosses), gain: stGain } });
  }
  harvestables.filter(r => r.t.isLT).forEach(({ h, t }) => {
    moves.push({ tone: 'faint', save: null,
      head: `${h.symbol}'s LT loss has no benefit this year`,
      body: `Your LT gains are already exempt — booking this ${fmtINR(Math.round(Math.abs(t.gain)))} loss now is wasted. It carries forward 8 years.`,
      stocks: [h], visual: null });
  });
  /* loss timing — an ST loss is more flexible than an LT one; book before it converts */
  harvestables.filter(r => !r.t.isLT && r.t.daysToLT <= 270).forEach(({ h, t }) => {
    moves.push({ tone: 'warn', save: null,
      head: `Book ${h.symbol}'s loss while it's still short-term`,
      body: `After ${ltDate(h)} it becomes a long-term loss, which can only offset LT gains. Short-term losses offset any gain.`,
      stocks: [h],
      visual: { type: 'ring', held: t.heldDays, days: t.daysToLT } });
  });
  /* LT gains exceeding the exemption — split selling across FYs */
  if (ltTaxable > 0) {
    moves.push({ tone: 'up', save: Math.min(ltTaxable, LTCG_EXEMPTION) * LTCG_RATE,
      head: 'Split your LT selling across two financial years',
      body: `${fmtINR(Math.round(ltTaxable))} of LT gains exceed this year's exemption. Sell up to ₹1.25L now and the rest after Apr 1 to use next year's allowance too.`,
      stocks: rows.filter(r => r.t.isLT && r.t.gain > 0).map(r => r.h), visual: null });
  }
  /* exemption deadline — unused room doesn't carry forward */
  if (exemptionLeft > 0 && ltGain > 0) {
    moves.push({ tone: 'faint', save: null,
      head: 'Unused tax-free room expires 31 Mar',
      body: `Your remaining ${fmtINR(Math.round(exemptionLeft))} of LT exemption resets every FY — it doesn't carry forward. If you plan to trim winners, this allowance is use-it-or-lose-it.`,
      stocks: [], visual: null });
  }
  /* no wash-sale rule — harvesting doesn't mean exiting */
  if (harvestables.length > 0) {
    moves.push({ tone: 'faint', save: null,
      head: "Harvesting a loss doesn't mean exiting the stock",
      body: 'India has no wash-sale rule — you can book a loss and buy the same shares back immediately. Your position stays, the tax benefit is real.',
      stocks: [], visual: null });
  }
  /* rank: rupee impact first, actionable before informational */
  moves.sort((a, b) => ((b.save || 0) - (a.save || 0)) || ((a.tone === 'faint' ? 1 : 0) - (b.tone === 'faint' ? 1 : 0)));

  function ltDate(h) {
    return new Date(new Date(h.buyDate).getTime() + 365 * 86400000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  }

  /* stacked composition bar */
  const compTotal = ltGain + stGain + Math.abs(losses) || 1;
  const seg = v => `${(v / compTotal) * 100}%`;

  return (
    <div className="fade-up">
      {/* hero — the headline number plus composition */}
      <div className="surface rounded-2xl p-5 sm:p-6 mb-3">
        <div className="flex flex-wrap items-end justify-between gap-6">
          <div>
            <p className="text-[10px] uppercase tracking-[0.1em] text-faint font-semibold">If you sold everything today</p>
            <div className="flex items-baseline gap-3 mt-2">
              <p className="text-[32px] num font-medium tracking-tight leading-none">{fmtINR(Math.round(totalTax))}</p>
              <span className="text-[12px] text-muted">tax on {fmtINR(Math.round(netGain))} net gains</span>
            </div>
            <p className="text-[11px] text-faint mt-2">indicative · equity delivery · FY26</p>
          </div>
          {/* tax-free room — the benefit, not the rule */}
          <div className="min-w-[220px] flex-1 max-w-[320px] sm:text-right">
            <p className="text-[10px] uppercase tracking-[0.1em] text-faint font-semibold">Still tax-free this year</p>
            <p className="text-[20px] num font-medium tracking-tight mt-1.5" style={{ color: 'var(--up)' }}>{fmtINR(Math.round(exemptionLeft))}</p>
            <p className="text-[10.5px] text-faint mt-1 leading-[1.5]">Long-term profit you can still book this FY without paying any tax.</p>
          </div>
        </div>
        {/* composition bar — LT green, ST blue, losses red */}
        <div className="mt-5">
          <div className="h-[4px] rounded-full overflow-hidden flex gap-[3px]">
            <div className="rounded-full" style={{ width: seg(ltGain), background: 'var(--up)', opacity: .8 }}></div>
            <div className="rounded-full" style={{ width: seg(stGain), background: 'var(--st)', opacity: .8 }}></div>
            <div className="rounded-full" style={{ width: seg(Math.abs(losses)), background: 'var(--down)', opacity: .55 }}></div>
          </div>
          <div className="flex flex-wrap gap-x-5 gap-y-1 mt-2.5">
            <span className="text-[10.5px] text-faint flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full" style={{ background: 'var(--up)', opacity: .8 }}></span>Long-term gains <span className="num text-muted">{fmtINR(Math.round(ltGain))}</span> <span className="num">· tax {fmtINR(Math.round(ltTax))}</span></span>
            <span className="text-[10.5px] text-faint flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full" style={{ background: 'var(--st)', opacity: .8 }}></span>Short-term gains <span className="num text-muted">{fmtINR(Math.round(stGain))}</span> <span className="num">· tax {fmtINR(Math.round(stTax))}</span></span>
            <span className="text-[10.5px] text-faint flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full" style={{ background: 'var(--down)', opacity: .55 }}></span>Unbooked losses <span className="num text-muted">{fmtINR(Math.round(losses))}</span></span>
          </div>
        </div>
      </div>

      <div className="grid lg:grid-cols-5 gap-3">
        {/* smart moves — the hero column: ranked list, color only on savings */}
        <div className="lg:col-span-3 surface rounded-2xl p-5">
          <div className="flex items-center justify-between">
            <p className="font-medium text-[13px] tracking-tight">Smart moves <span className="num text-faint font-normal">· {moves.length}</span></p>
            <span className="text-[10px] num text-faint uppercase tracking-[0.08em]">ranked by impact</span>
          </div>
          <div className="mt-3 overflow-y-auto pr-2" style={{ maxHeight: 430 }}>
            {moves.map((m, i) => (
              <div key={i} className="flex items-start gap-4 py-4" style={i < moves.length - 1 ? { borderBottom: '1px solid var(--border)' } : {}}>

                    </div>
                  </div>
                  <span className="text-[12px] num" style={{ color: 'var(--down)' }}>{fmtINR(Math.round(t.gain))}</span>
                </div>
              ))}
              <p className="text-[10.5px] text-faint leading-[1.6] pt-3" style={{ borderTop: '1px solid var(--border)' }}>
                Short-term losses offset both ST and LT gains. Unused losses carry forward 8 years if you file on time.
              </p>
            </div>
          ) : <p className="mt-4 text-[12px] text-muted">No unrealized losses — nothing to harvest.</p>}
        </div>
      </div>

      {/* long-term timeline — full width, real time axis */}
      <div className="surface rounded-2xl p-5 mt-3">
        <div className="flex items-center justify-between">
          <p className="font-medium text-[13px] tracking-tight">Long-term timeline</p>
          <p className="text-[10px] num text-faint uppercase tracking-[0.08em]">
            already long-term · {rows.filter(r => r.t.isLT).map(r => r.h.symbol).join(' · ')} <span style={{ color: 'var(--up)' }}>✓</span>
          </p>
        </div>
        <p className="text-[11px] text-faint mt-0.5">When each holding crosses 12 months and its tax rate drops to 12.5%</p>
        {(() => {
          const pending = rows.filter(r => !r.t.isLT).sort((a, b) => a.t.daysToLT - b.t.daysToLT);
          const fyEnd = new Date('2027-03-31');
          const span = fyEnd - TODAY;
          const pos = d => Math.min(96, Math.max(3, ((d - TODAY) / span) * 100));

          /* cluster holdings maturing in the same month into one marker */
          const groups = Object.values(pending.reduce((acc, r) => {
            const d = new Date(new Date(r.h.buyDate).getTime() + 365 * 86400000);
            const key = `${d.getFullYear()}-${d.getMonth()}`;
            (acc[key] = acc[key] || { date: d, items: [] }).items.push(r);
            return acc;
          }, {})).sort((a, b) => a.date - b.date);

          const alternate = groups.length > 4; // single lane until it gets crowded
          const LANE = 64, AXIS = 22;

          const Label = ({ g }) => {
            const multi = g.items.length > 1;
            const totalSave = g.items.reduce((a, r) => a + (r.t.gain > 0 ? r.t.gain * (STCG_RATE - LTCG_RATE) : 0), 0);
            const dateStr = g.date.toLocaleDateString('en-IN', { day: multi ? undefined : 'numeric', month: 'short' });
            return (
              <div title={multi ? g.items.map(r => r.h.symbol).join(', ') : undefined}>
                <p className="text-[11px] font-medium whitespace-nowrap text-center">{multi ? `${g.items.length} holdings` : g.items[0].h.symbol}</p>
                <p className="text-[10px] num text-faint whitespace-nowrap text-center mt-0.5">
                  {dateStr} · {multi ? `${g.items[0].t.daysToLT}–${g.items[g.items.length - 1].t.daysToLT}d` : `${g.items[0].t.daysToLT}d`}
                </p>
                {totalSave > 0 && <p className="text-[10px] num whitespace-nowrap text-center mt-0.5" style={{ color: 'var(--up)' }}>+{fmtINR(Math.round(totalSave))} if you wait</p>}
                {multi && <p className="text-[9px] num text-faint whitespace-nowrap text-center mt-0.5">{g.items.map(r => r.h.symbol).slice(0, 3).join(' · ')}{g.items.length > 3 ? ' +' + (g.items.length - 3) : ''}</p>}
              </div>
            );
          };

          return (
            <div className="mt-6 px-2">
              <div className="relative" style={{ height: (alternate ? LANE : 0) + AXIS + LANE }}>
                {/* axis */}
                {(() => { const axisY = (alternate ? LANE : 0) + AXIS / 2; return (
                  <React.Fragment>
                    <div className="absolute left-0 right-0 h-px" style={{ background: 'var(--border-strong)', top: axisY }}></div>
                    {/* today cap */}
                    <div className="absolute" style={{ left: 0, top: axisY - 3 }}>
                      <div className="w-[7px] h-[7px] rounded-full" style={{ background: 'var(--text)' }}></div>
                      <p className="text-[9.5px] num text-faint mt-1.5">today</p>
                    </div>
                    {/* FY end cap */}
                    <div className="absolute" style={{ right: 0, top: axisY - 4 }}>
                      <div className="w-px h-[9px] ml-auto" style={{ background: 'var(--border-strong)' }}></div>
                      <p className="text-[9.5px] num text-faint mt-1.5 text-right">FY end · 31 Mar</p>
                    </div>
                    {/* markers */}
                    {groups.map((g, gi) => {
                      const multi = g.items.length > 1;
                      const above = alternate && gi % 2 === 0;
                      return (
                        <React.Fragment key={gi}>
                          {/* dot centered on axis */}
                          <div className="absolute" style={{ left: `${pos(g.date)}%`, top: axisY, transform: 'translate(-50%, -50%)' }}>
                            {multi
                              ? <div className="min-w-[18px] h-[18px] px-1 rounded-full flex items-center justify-center num text-[9px] font-medium" style={{ background: 'var(--surface)', border: '1.5px solid var(--text-muted)' }}>{g.items.length}</div>
                              : <div className="w-[7px] h-[7px] rounded-full" style={{ background: 'var(--surface)', border: '1.5px solid var(--text-muted)' }}></div>}
                          </div>
                          {/* label in its lane, never overlapping the axis or header */}
                          <div className="absolute flex justify-center" style={{
                            left: `${pos(g.date)}%`, transform: 'translateX(-50%)',
                            ...(above ? { bottom: AXIS + LANE, alignItems: 'flex-end' } : { top: (alternate ? LANE : 0) + AXIS, alignItems: 'flex-start' }),
                          }}>
                            <Label g={g} />
                          </div>
                        </React.Fragment>
                      );
                    })}
                  </React.Fragment>
                ); })()}
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

    <svg viewBox={viewBox} fill="none" className={`constel ${className || ''}`} style={{ opacity: active ? 0.36 : 0.12, ...style }}>
      {edges.map(([a, b], i) => (
        <line key={i} x1={points[a][0]} y1={points[a][1]} x2={points[b][0]} y2={points[b][1]} stroke={color} strokeWidth="0.9" opacity="0.55" />
      ))}
      {Object.entries(points).map(([k, [x, y]]) => (
        <g key={k}>
          <circle cx={x} cy={y} r="3.6" fill={color} opacity="0.15" />
          <circle cx={x} cy={y} r="1.5" fill={color} />
        </g>
      ))}
    </svg>
  );
}

/* one holding as a floating orb — size = weight, height = alpha, ring = sentiment */
function CanvasNode({ h, x, y, size, dur, delay, dayChange, spark, onOpen }) {
  const pnl = (h.ltp - h.avgPrice) * h.qty;
  const pnlPct = (pnl / (h.qty * h.avgPrice || 1)) * 100;
  const tone = SENTIMENT_META[h.sentiment].tone;
  const R = size / 2 - 3;
  const C = 2 * Math.PI * R;
  const score = h.sentimentScore ?? 50;
  const day = dayChange ?? 0;
  return (
    <div className="node-wrap" style={{ left: `${x}%`, top: `${y}%` }}>
      <div className="node-float" style={{ animationDuration: `${dur.toFixed(1)}s`, animationDelay: `-${delay.toFixed(1)}s` }}>
        <button onClick={() => onOpen(h)} className="orb ring-focus" style={{ width: size, height: size }} aria-label={`${h.name} — open details`}>
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="absolute inset-0 -rotate-90">
            <circle cx={size / 2} cy={size / 2} r={R} fill="none" stroke="var(--border-strong)" strokeWidth="1.5" opacity="0.5" />
            <circle cx={size / 2} cy={size / 2} r={R} fill="none" stroke={`var(--${tone})`} strokeWidth="2" strokeLinecap="round"
              strokeDasharray={`${(C * score) / 100} ${C}`} opacity="0.85" />

/* the spatial home — holdings float on a field, height mapped to alpha vs NIFTY */
function CanvasView({ holdings, trends, totals, marketMood, onOpen, onAdd }) {
  const total = totals.current || 1;
  const [compact, setCompact] = useState(() => window.innerWidth < 640);
  useEffect(() => {
    const onResize = () => setCompact(window.innerWidth < 640);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  const nodes = useMemo(() => {
    const n = holdings.length;
    const scale = compact ? 0.68 : 1;
    return holdings.map((h, i) => {
      const rnd = seedRandom(seedFromString(h.id + ':canvas'));
      const w = (h.qty * h.ltp) / total;
      const size = Math.round(Math.min(116, Math.max(62, 52 + Math.sqrt(w) * 122)) * scale);
      const a = Math.max(-16, Math.min(16, h.alpha || 0));
      const y = Math.max(16, Math.min(86, 50 - (a / 16) * 30 + (rnd() * 8 - 4)));
      const x = Math.max(10, Math.min(90, n === 1 ? 50 : 11 + (i / (n - 1)) * 78 + (rnd() * 6 - 3)));
      return { h, x, y, size, dur: 5 + rnd() * 4, delay: rnd() * 6 };
    });
  }, [holdings, total, compact]);
  const mood = totals.avgSentiment >= 60 ? 'positive' : totals.avgSentiment >= 45 ? 'neutral' : 'cautious';

  return (
    <div className="fade-up">
      <section className="mt-6 relative canvas-dots rounded-2xl" style={{ height: 'max(500px, calc(100vh - 275px))', border: '1px solid var(--border)' }}>
        {/* greeting + portfolio hero — floats over the field */}
        <div className="absolute top-5 left-6 z-10 pointer-events-none">
          <p className="text-[11px] num text-faint">{TODAY.toLocaleDateString('en-IN', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
          {holdings.length === 0 ? (
            <h1 className="text-[14px] sm:text-[17px] font-medium tracking-tight mt-1">Hello, Akhil. <span style={{ color: 'var(--text-faint)' }}>Your canvas is waiting.</span></h1>
          ) : (
            <React.Fragment>
              <h1 className="text-[14px] sm:text-[17px] font-medium tracking-tight mt-1">
                Hello, Akhil. Your portfolio is <span style={{ color: mood === 'positive' ? 'var(--up)' : mood === 'neutral' ? 'var(--warn)' : 'var(--down)' }}>{mood}</span>.
              </h1>
              <div className="flex items-baseline gap-2 mt-2">
                <p className="text-[19px] sm:text-[24px] num font-medium tracking-tight leading-none">{fmtINR(Math.round(totals.current))}</p>
                <Delta value={totals.pnlPct} />
              </div>
            </React.Fragment>
          )}
        </div>

        {/* the line to beat */}
        <div className="absolute left-0 right-0 top-1/2 z-0" style={{ borderTop: '1px dashed var(--border-strong)' }}>
          <span className="absolute right-4 -top-2.5 text-[9px] uppercase tracking-[0.12em] font-semibold text-faint px-2 py-0.5 rounded-full" style={{ background: 'var(--bg)' }}>
            NIFTY 50 — the line to beat
          </span>
        </div>
        <span className="absolute right-5 top-[13%] text-[9px] uppercase tracking-[0.14em] text-faint font-semibold opacity-70 pointer-events-none">beating the market ↑</span>
        <span className="absolute right-5 bottom-[10%] text-[9px] uppercase tracking-[0.14em] text-faint font-semibold opacity-70 pointer-events-none">lagging ↓</span>

        {/* the two moods of the market — whichever rules today burns brighter */}
        <Bull active={marketMood !== 'bear'} className="absolute hidden sm:block" style={{ left: '38%', top: '4%', width: 190 }} />
        <Bear active={marketMood === 'bear'} className="absolute hidden sm:block" style={{ right: '20%', bottom: '5%', width: 210 }} />

        {holdings.length === 0 ? (
          <div className="absolute inset-0 flex items-center justify-center">
            <EmptyState title="Your canvas is empty" subtitle="Add holdings and they'll float here as living positions — size is weight, height is performance vs NIFTY." cta="+ Add position" onCta={onAdd} />
          </div>
        ) : nodes.map(({ h, ...pos }) => (
          <CanvasNode key={h.id} h={h} {...pos} dayChange={trends[h.id]?.dayChange} spark={trends[h.id]?.series || genTrend(h.id, h.ltp)} onOpen={onOpen} />
        ))}

        {/* how to read this */}
        <div className="absolute bottom-4 left-6 z-10 flex flex-wrap items-center gap-x-4 gap-y-1 pointer-events-none">
          {[['size', 'position value'], ['height', 'vs NIFTY 50'], ['ring', 'sentiment'], ['red dot', 'needs review']].map(([k, v]) => (
            <span key={k} className="text-[9.5px] text-faint"><span className="font-semibold uppercase tracking-[0.08em]">{k}</span> — {v}</span>
          ))}
        </div>
      </section>
    </div>
  );
}

/* ---- bento tiles — each communicates one idea, visually first ---- */
function GaugeTile({ label, value, tone, sub, className }) {
  const pct = Math.max(0, Math.min(100, value ?? 50));
  const C = Math.PI * 48;
  return (
    <div className={`surface rounded-2xl p-4 flex flex-col items-center ${className || ''}`}>
      <p className="text-[9px] uppercase tracking-[0.1em] text-faint font-semibold self-start">{label}</p>
      <div className="flex-1 flex items-end justify-center relative mt-1">
        <svg width="132" height="74" viewBox="0 0 120 68">
          <path d="M 12 62 A 48 48 0 0 1 108 62" fill="none" stroke="var(--border-strong)" strokeWidth="6" strokeLinecap="round" opacity="0.45" />
          <path d="M 12 62 A 48 48 0 0 1 108 62" fill="none" stroke={`var(--${tone})`} strokeWidth="6" strokeLinecap="round"
            strokeDasharray={`${(C * pct) / 100} ${C}`} />
        </svg>
        <p className="absolute bottom-0 left-1/2 -translate-x-1/2 text-[22px] num font-medium leading-none">{Math.round(pct)}</p>
      </div>
      <p className="text-[10px] mt-2 font-medium" style={{ color: `var(--${tone})` }}>{sub}</p>
    </div>
  );
}

function TaxRingTile({ h, className }) {
  const tax = taxInfo(h);
  const pct = Math.min(1, tax.heldDays / 365);
  const R = 30, C = 2 * Math.PI * R;
  const tone = tax.isLT ? 'up' : 'warn';
  return (
    <div className={`surface rounded-2xl p-4 flex flex-col items-center ${className || ''}`}>

            strokeDasharray={`${C * pct} ${C}`} />

function AlphaTile({ alpha, className }) {
  const a = Math.max(-20, Math.min(20, alpha || 0));
  const half = (Math.abs(a) / 20) * 50;
  const up = a >= 0;
  return (
    <div className={`surface rounded-2xl p-4 flex flex-col ${className || ''}`}>
      <p className="text-[9px] uppercase tracking-[0.1em] text-faint font-semibold">vs NIFTY 50</p>

          <span className="absolute top-0 bottom-0 rounded-full" style={{
            left: up ? '50%' : `${50 - half}%`, width: `${half}%`,
            background: up ? 'var(--up)' : 'var(--down)', opacity: 0.85 }}></span>

        <div className="flex justify-between mt-1.5 text-[9px] text-faint num"><span>lagging</span><span>NIFTY</span><span>beating</span></div>

}

function PositionTile({ h, className }) {
  const invested = h.qty * h.avgPrice, current = h.qty * h.ltp;
  const max = Math.max(invested, current) || 1;
  const up = current >= invested;
  return (
    <div className={`surface rounded-2xl p-4 flex flex-col ${className || ''}`}>
      <div className="flex items-center justify-between">
        <p className="text-[9px] uppercase tracking-[0.1em] text-faint font-semibold">Position</p>
        <p className="text-[10px] num text-faint">{h.qty} × {fmtINR(h.avgPrice)}</p>
      </div>
      <div className="flex-1 flex flex-col justify-center gap-2.5 mt-2">
        {[['invested', invested, 'var(--chart-grey)'], ['now', current, up ? 'var(--up)' : 'var(--down)']].map(([label, v, color]) => (
          <div key={label}>
            <div className="flex justify-between text-[9.5px] mb-1">
              <span className="text-faint uppercase tracking-[0.08em] font-semibold">{label}</span>
              <span className="num text-muted">{fmtINR(Math.round(v))}</span>
            </div>
            <div className="h-[5px] rounded-full" style={{ background: 'var(--surface-2)' }}>
              <div className="h-full rounded-full" style={{ width: `${(v / max) * 100}%`, background: color, opacity: 0.85 }}></div>
            </div>
          </div>
        ))}
      </div>
      <p className="text-[10.5px] num mt-2" style={{ color: up ? 'var(--up)' : 'var(--down)' }}>
        {fmtSigned(Math.round(current - invested))} · {(((current - invested) / (invested || 1)) * 100).toFixed(1)}%

                  className="px-3.5 py-2.5 rounded-xl text-[12.5px] num outline-none ring-focus" style={{ background: 'var(--surface-2)', border: '1px solid var(--border)', color: 'var(--text)' }} />
              </div>
            )}
            <button onClick={submitManual} disabled={!picked || !qty || !price}
              className="w-full py-3 rounded-xl font-medium text-[12.5px] transition-opacity disabled:opacity-30 disabled:cursor-not-allowed"
              style={{ background: 'var(--text)', color: 'var(--bg)' }}>
              Add to portfolio
            </button>
          </div>
        )}

        {mode === 'upload' && (
          <div className="mt-4 space-y-3.5">
            <div onClick={() => fileRef.current.click()}
              className="rounded-xl p-8 text-center cursor-pointer transition-colors hov"
              style={{ border: '1.5px dashed var(--border-strong)' }}>
              <p className="text-[12.5px] font-medium">{fileName || 'Drop your holdings CSV or XLSX'}</p>
              <p className="text-[10.5px] text-faint mt-1.5">Supports CSV and XLSX exports from Zerodha, Groww, Upstox & more</p>
              <input ref={fileRef} type="file" accept=".csv,.xlsx,.xls" className="hidden" onChange={handleFile} />
            </div>

            {parseStatus === 'parsing' && (
              <p className="text-[11px] text-center text-faint">Reading {fileName}…</p>
            )}
            {parseStatus === 'error' && (
              <div className="text-center space-y-1.5">
                <p className="text-[11px]" style={{ color: 'var(--down)' }}>{parseError}</p>
                {parseDebug && (
                  <>
                    <button onClick={() => setShowDebug(s => !s)} className="text-[10.5px] underline text-faint">
                      {showDebug ? 'Hide' : 'Show'} file contents
                    </button>
                    {showDebug && (
                      <pre className="text-left text-[10px] leading-[1.5] p-2.5 rounded-lg overflow-x-auto whitespace-pre"
                        style={{ background: 'var(--surface-2)', border: '1px solid var(--border)', maxHeight: '200px' }}>
                        {parseDebug}
                      </pre>
                    )}
                  </>
                )}
              </div>
            )}
            {parseStatus === 'done' && (
              <div className="rounded-xl p-3 space-y-1.5" style={{ background: 'var(--surface-2)', border: '1px solid var(--border)' }}>
                <p className="text-[11px] font-medium">{parsedHoldings.length} holding{parsedHoldings.length > 1 ? 's' : ''} found</p>
                <div className="flex flex-wrap gap-1.5">
                  {parsedHoldings.map(h => (
                    <span key={h.id} className="inline-flex items-center gap-1.5 px-2 py-1 rounded-full text-[10.5px]" style={{ background: 'var(--surface)', border: '1px solid var(--border)' }}>
                      <Mark mono={h.mono} hue={h.hue} size="sm" />
                      {h.symbol} <span className="text-faint">· {h.qty}</span>
                    </span>
                  ))}
                </div>
              </div>
            )}

            <button onClick={submitUpload} disabled={parseStatus !== 'done'}
              className="w-full py-3 rounded-xl font-medium text-[12.5px] transition-opacity disabled:opacity-30 disabled:cursor-not-allowed"
              style={{ background: 'var(--text)', color: 'var(--bg)' }}>
              Import holdings
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* local profile switcher — lets different people use this prototype on the same device,
   each with their own Live holdings stored under a separate localStorage namespace */
function ProfileSwitcher({ profile, profiles, onSwitch, onAdd, hasLiveData, onClear }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onClick = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onClick);
    return () => document.removeEventListener('mousedown', onClick);
  }, [open]);

  const handleAdd = () => {
    const name = window.prompt('Name for the new profile?');
    if (name) onAdd(name);
    setOpen(false);
  };
  const handleClear = () => {
    if (window.confirm(`Clear all imported holdings for "${profile}"?`)) onClear();
    setOpen(false);
  };

  return (
    <div ref={ref} className="relative">
      <button onClick={() => setOpen(o => !o)}
        className="flex items-center gap-1.5 pl-1.5 pr-2.5 py-1 rounded-full surface glass-flat hov">
        <span className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-semibold"
          style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>
          {profile.charAt(0).toUpperCase()}
        </span>
        <span className="hidden sm:inline text-[11px] font-medium text-muted">{profile}</span>
        <span className="text-faint" style={{ transform: open ? 'rotate(90deg)' : 'rotate(0deg)', transition: 'transform .15s' }}>
          <Icon.chevron />
        </span>
      </button>
      {open && (
        <div className="absolute right-0 top-[calc(100%+6px)] w-48 rounded-xl p-1.5 shadow-2xl fade-up z-30"
          style={{ background: 'var(--surface)', border: '1px solid var(--border-strong)' }}>
          {profiles.map(p => (
            <button key={p} onClick={() => { onSwitch(p); setOpen(false); }}
              className="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-left hov"
              style={p === profile ? { background: 'var(--surface-2)' } : {}}>
              <span className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-semibold"
                style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>
                {p.charAt(0).toUpperCase()}
              </span>
              <span className="text-[12px] font-medium truncate">{p}</span>
            </button>
          ))}
          <div className="my-1 border-t" style={{ borderColor: 'var(--border)' }}></div>
          <button onClick={handleAdd} className="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-left hov text-faint">
            <span className="w-5 h-5 rounded-full flex items-center justify-center" style={{ background: 'var(--surface-2)' }}>
              <Icon.plus />
            </span>
            <span className="text-[12px] font-medium">New profile</span>
          </button>
          {hasLiveData && (
            <button onClick={handleClear} className="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-left hov" style={{ color: 'var(--down)' }}>
              <span className="w-5 h-5 rounded-full flex items-center justify-center" style={{ background: 'var(--surface-2)' }}>
                <Icon.close />
              </span>
              <span className="text-[12px] font-medium">Clear {profile}'s holdings</span>
            </button>
          )}
        </div>
      )}
    </div>
  );
}
