function taxInfo(h) {

  const isLT = heldDays >= 365;

}

/* ========================== SEEDED RANDOM / TRENDS ========================= */
function seedFromString(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0; return Math.abs(h) || 1; }
function seedRandom(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function genTrend(seedStr, end, points = 22, biasUp = true) {
  const rnd = seedRandom(seedFromString(seedStr));
  let val = end * (biasUp ? (0.90 + rnd() * 0.05) : (1.05 + rnd() * 0.06));
  const arr = [val];
  for (let i = 1; i < points; i++) {
    const pull = (end - val) / (points - i) * 0.55;
    const noise = (rnd() - 0.5) * end * 0.022;
    val = val + pull + noise;
    arr.push(val);
  }
  arr[arr.length - 1] = end;
  return arr;
}

/* ================================ THEME ==================================== */
function useTheme() {
  const [theme, setTheme] = useState(() => localStorage.getItem('holdr-theme') || 'dark');
  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    localStorage.setItem('holdr-theme', theme);
  }, [theme]);
  return [theme, setTheme];
}

function ThemeToggle({ theme, setTheme }) {
  const isDark = theme === 'dark';
  return (

}

}

function Mark({ mono, hue, size = 'md' }) {
  const dims = size === 'lg' ? 'w-11 h-11 text-[13px]' : size === 'sm' ? 'w-8 h-8 text-[10px]' : 'w-9 h-9 text-[11px]';
  return (
    <div className={`${dims} rounded-lg flex items-center justify-center font-semibold font-mono shrink-0`}
      style={{ background: `${hue}14`, color: hue, border: `1px solid ${hue}2E` }}>
      {mono}
    </div>
  );
}

function CandleDeco({ width = 200, height = 120, seed = 'deco', className = '' }) {
  const rnd = seedRandom(seedFromString(seed));
  const candles = Array.from({ length: 12 }, (_, i) => {
    const x = 8 + i * (width / 12);
    const mid = height * (0.55 - (i / 12) * 0.28) + (rnd() - 0.5) * height * 0.18;
    const body = 8 + rnd() * height * 0.22;
    const wick = body + 10 + rnd() * 12;
    const up = rnd() > 0.38;
    return { x, mid, body, wick, up };
  });
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className={className} fill="none">
      {candles.map((c, i) => (
        <g key={i} className="candle-drift" style={{ animationDelay: `${i * 0.25}s` }}>
          <line x1={c.x} x2={c.x} y1={c.mid - c.wick / 2} y2={c.mid + c.wick / 2} stroke={c.up ? 'var(--success)' : 'var(--danger)'} strokeWidth="1.4" opacity="0.5" />
          <rect x={c.x - 3.5} y={c.mid - c.body / 2} width="7" height={c.body} rx="1.5" fill={c.up ? 'var(--success)' : 'var(--danger)'} opacity={c.up ? 0.85 : 0.75} />
        </g>
      ))}
    </svg>
  );
}

/* ============================== TICKER TAPE ================================ */
function TickerTape({ holdings, trends }) {
  const items = holdings.map(h => ({ symbol: h.symbol, ltp: h.ltp, change: trends[h.id]?.dayChange ?? 0 }));
  const strip = [...items, ...items];
  return (
    <div className="tape-mask relative z-20" style={{ borderBottom: '1px solid var(--border)', background: 'var(--bg-soft)' }}>
      <div className="tape py-2">
        {strip.map((it, i) => (
          <div key={i} className="flex items-center gap-2 px-5 whitespace-nowrap" style={{ borderRight: '1px solid var(--border)' }}>
            <span className="text-[11px] font-semibold tracking-wide text-muted">{it.symbol}</span>
            <span className="text-[11px] num">{fmtINR(it.ltp)}</span>
            <span className="text-[11px] num font-medium" style={{ color: it.change >= 0 ? 'var(--success)' : 'var(--danger)' }}>
              {it.change >= 0 ? '▲' : '▼'}{Math.abs(it.change).toFixed(2)}%
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================================ CHARTS =================================== */
function Sparkline({ data, positive, id, width = 110, height = 32 }) {
  const min = Math.min(...data), max = Math.max(...data);
  const range = (max - min) || 1;
  const stepX = width / (data.length - 1);
  const pts = data.map((d, i) => [i * stepX, height - ((d - min) / range) * (height - 4) - 2]);
  const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = `${line} L ${width},${height} L 0,${height} Z`;
  const color = positive ? 'var(--success)' : 'var(--danger)';
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} className="overflow-visible shrink-0">
      <defs>
        <linearGradient id={`spark-${id}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.18" /><stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#spark-${id})`} stroke="none" />
      <path d={line} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

/* portfolio vs benchmark — both normalized to start at 100 */
function CompareChart({ portfolio, benchmark, positive, height = 216 }) {
  const width = 780, pad = 14, h = height - pad * 2;
  const norm = arr => arr.map(v => (v / arr[0]) * 100);
  const p = norm(portfolio), b = norm(benchmark);
  const all = [...p, ...b];
  const min = Math.min(...all), max = Math.max(...all);
  const range = (max - min) || 1;
  const y = v => pad + (h - ((v - min) / range) * h);
  const toLine = arr => {
    const stepX = width / (arr.length - 1);
    return arr.map((v, i) => (i === 0 ? 'M' : 'L') + (i * stepX).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  };
  const pLine = toLine(p), bLine = toLine(b);
  const pArea = `${pLine} L ${width},${height} L 0,${height} Z`;
  const color = positive ? 'var(--success)' : 'var(--danger)';
  const lastX = width, lastPY = y(p[p.length - 1]);
  return (
    <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="w-full" style={{ height }}>
      <defs>
        <linearGradient id="cmp-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.16" /><stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0.25, 0.5, 0.75].map((f, i) => (
        <line key={i} x1="0" x2={width} y1={height * f} y2={height * f} stroke="var(--border)" strokeWidth="1" />

function SentimentMeter({ score }) {
  const angle = -90 + (score / 100) * 180;
  const tone = score >= 60 ? 'success' : score >= 45 ? 'warning' : 'danger';
  return (
    <div className="relative w-[88px] h-[52px] shrink-0">
      <svg viewBox="0 0 88 52" className="w-full h-full">
        <path d="M 8 48 A 36 36 0 0 1 80 48" fill="none" stroke="var(--border-strong)" strokeWidth="5" strokeLinecap="round" />
        <path d="M 8 48 A 36 36 0 0 1 80 48" fill="none" stroke={`var(--${tone})`} strokeWidth="5" strokeLinecap="round" strokeDasharray={`${(score / 100) * 113} 113`} />
        <g transform={`rotate(${angle} 44 48)`}>
          <line x1="44" y1="48" x2="44" y2="22" stroke="var(--text)" strokeWidth="2" strokeLinecap="round" />
          <circle cx="44" cy="48" r="3.5" fill="var(--text)" />
        </g>
      </svg>
    </div>
  );
}

/* ============================ DIGEST (TODAY) =============================== */
function DigestCard({ holdings, totals, mode }) {
  const flagged = holdings.filter(h => h.action === 'review');
  const maturing = holdings.map(h => ({ h, t: taxInfo(h) })).filter(x => !x.t.isLT && x.t.daysToLT <= 90).sort((a, b) => a.t.daysToLT - b.t.daysToLT);
  const items = [];

  items.push({
    tone: totals.alphaPeriod >= 0 ? 'success' : 'warning',
    head: totals.alphaPeriod >= 0 ? `Beating the market by ${totals.alphaPeriod.toFixed(1)}%` : `Trailing the market by ${Math.abs(totals.alphaPeriod).toFixed(1)}%`,
    body: `Your portfolio ${totals.pnlPct >= 0 ? 'is up' : 'is down'} ${Math.abs(totals.pnlPct).toFixed(1)}% overall vs NIFTY 50 over the same period.`,
  });
  if (flagged.length) {
    items.push({
      tone: 'danger',
      head: `${flagged.length} holding${flagged.length > 1 ? 's' : ''} need${flagged.length > 1 ? '' : 's'} a look`,
      body: flagged.map(h => `${h.symbol} — ${THESIS_META[h.thesisStatus].label.toLowerCase()}`).join(' · '),
    });
  }
  if (maturing.length) {
    const m = maturing[0];
    items.push({
      tone: 'accent',
      head: `${m.h.symbol} turns long-term in ${m.t.daysToLT} days`,
      body: `Selling after ${new Date(new Date(m.h.buyDate).getTime() + 365 * 86400000).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' })} drops tax from 20% to 12.5% on gains.`,
    });
  }
  items.push({
    tone: 'accent',
    head: 'HDFCBANK goes ex-dividend Jun 18',
    body: 'Hold through the date to receive the payout. 1 more corporate event this month.',
  });

  return (
    <div className="surface rounded-2xl p-5 sm:p-6">
      <div className="flex items-center justify-between">
        <p className="font-semibold text-[13px] tracking-tight">Since you last checked</p>
        <span className="text-[10px] num text-faint uppercase tracking-[0.08em]">{mode === 'active' ? 'Today' : 'This week'}</span>
      </div>
      <div className="mt-3 space-y-2.5">
        {items.slice(0, 4).map((it, i) => {
          const style = it.tone === 'accent'
            ? { background: 'var(--accent-soft)', color: 'var(--accent)' }
            : { background: `var(--${it.tone}-soft)`, color: `var(--${it.tone})` };
          return (
            <div key={i} className="flex items-start gap-3 fade-up" style={{ animationDelay: `${i * 70}ms` }}>
              <span className="mt-[5px] w-1.5 h-1.5 rounded-full shrink-0" style={{ background: style.color }}></span>
              <div className="min-w-0">
                <p className="text-[13px] font-semibold leading-snug" style={{ color: style.color }}>{it.head}</p>
                <p className="text-[12px] text-muted leading-snug mt-0.5">{it.body}</p>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SectorPulse({ holdings }) {
  const maxAbs = Math.max(...SECTOR_PULSE.map(s => Math.abs(s.chg)));
  const heldSectors = new Set(holdings.map(h => h.sector));
  return (
    <div className="surface rounded-2xl p-5 sm:p-6">
      <div className="flex items-center justify-between">
        <p className="font-semibold text-[13px] tracking-tight">Sector pulse</p>

      </div>
      <div className="mt-4 space-y-2.5">
        {SECTOR_PULSE.map((s, i) => {
          const positive = s.chg >= 0;
          const held = s.holdsSector && heldSectors.has(s.holdsSector);
          return (
            <div key={i} className="flex items-center gap-3">
              <div className="w-[150px] shrink-0 flex items-center gap-1.5">
                {held && <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: 'var(--accent)' }}></span>}

              </div>
              <div className="flex-1 flex items-center">
                <div className="w-1/2 flex justify-end">
                  {!positive && <div className="h-[6px] rounded-l-full" style={{ width: `${(Math.abs(s.chg) / maxAbs) * 100}%`, background: 'var(--danger)', opacity: 0.75 }}></div>}
                </div>
                <div className="w-px h-4 shrink-0" style={{ background: 'var(--border-strong)' }}></div>
                <div className="w-1/2">
                  {positive && <div className="h-[6px] rounded-r-full" style={{ width: `${(s.chg / maxAbs) * 100}%`, background: 'var(--success)', opacity: 0.85 }}></div>}
                </div>
              </div>
              <p className="w-[52px] text-right text-[11px] num font-semibold shrink-0" style={{ color: positive ? 'var(--success)' : 'var(--danger)' }}>
                {positive ? '+' : ''}{s.chg.toFixed(1)}%

            </div>

        })}
      </div>
    </div>
  );
}

/* ============================ TAX VIEW ===================================== */
function TaxView({ holdings }) {
  const rows = holdings.map(h => ({ h, t: taxInfo(h) }));
  const ltGain = rows.filter(r => r.t.isLT && r.t.gain > 0).reduce((a, r) => a + r.t.gain, 0);
  const stGain = rows.filter(r => !r.t.isLT && r.t.gain > 0).reduce((a, r) => a + r.t.gain, 0);
  const losses = rows.filter(r => r.t.gain < 0).reduce((a, r) => a + r.t.gain, 0);
  const ltTax = Math.max(0, ltGain - LTCG_EXEMPTION) * LTCG_RATE;
  const stTax = stGain * STCG_RATE;
  const harvestables = rows.filter(r => r.t.gain < 0);

  return (
    <div className="grid lg:grid-cols-3 gap-4 fade-up">
      {/* if you sold today */}
      <div className="surface rounded-2xl p-5 sm:p-6">
        <p className="font-semibold text-[13px] tracking-tight">If you sold everything today</p>
        <p className="text-[11px] text-faint mt-1">Indicative, equity delivery rules FY26</p>
        <div className="mt-5 space-y-3">
          <div className="flex items-center justify-between">
            <span className="text-[12px] text-muted">Long-term gains (12.5%)</span>
            <span className="text-[13px] num font-semibold">{fmtINR(Math.round(ltGain))}</span>
          </div>
          <div className="flex items-center justify-between">
            <span className="text-[12px] text-muted">Short-term gains (20%)</span>
            <span className="text-[13px] num font-semibold">{fmtINR(Math.round(stGain))}</span>
          </div>
          <div className="flex items-center justify-between">
            <span className="text-[12px] text-muted">Booked losses (offsettable)</span>
            <span className="text-[13px] num font-semibold" style={{ color: 'var(--danger)' }}>{fmtINR(Math.round(losses))}</span>
          </div>
          <div className="pt-3 flex items-center justify-between" style={{ borderTop: '1px solid var(--border)' }}>
            <span className="text-[12px] font-semibold">Estimated tax</span>
            <span className="text-[16px] num font-semibold" style={{ color: 'var(--warning)' }}>{fmtINR(Math.round(ltTax + stTax))}</span>
          </div>
          <p className="text-[11px] text-faint leading-relaxed">First ₹1.25L of long-term gains each year is tax-free. Losses can offset gains — see right.</p>
        </div>
      </div>

      {/* LT clock per holding */}
      <div className="surface rounded-2xl p-5 sm:p-6">
        <p className="font-semibold text-[13px] tracking-tight">Long-term clock</p>
        <p className="text-[11px] text-faint mt-1">Each holding's journey to the 12.5% rate</p>
        <div className="mt-4 space-y-3.5">
          {rows.sort((a, b) => a.t.daysToLT - b.t.daysToLT).map(({ h, t }) => (
            <div key={h.id}>
              <div className="flex items-center justify-between mb-1.5">
                <div className="flex items-center gap-2">
                  <span className="text-[12px] font-semibold">{h.symbol}</span>
                  {t.isLT
                    ? <Tone varName="success" mono>LT ✓</Tone>
                    : <span className="text-[10px] num text-faint">{t.daysToLT}d to go</span>}
                </div>
                <span className="text-[10px] num text-faint">{Math.min(t.heldDays, 365)}/365d</span>
              </div>
              <div className="h-[5px] rounded-full overflow-hidden" style={{ background: 'var(--border)' }}>
                <div className="h-full rounded-full transition-all" style={{
                  width: `${Math.min(100, (t.heldDays / 365) * 100)}%`,
                  background: t.isLT ? 'var(--success)' : 'var(--accent)', opacity: 0.9,
                }}></div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* harvesting */}
      <div className="surface rounded-2xl p-5 sm:p-6">
        <p className="font-semibold text-[13px] tracking-tight">Loss harvesting</p>
        <p className="text-[11px] text-faint mt-1">Losses you could book to offset gains</p>
        {harvestables.length ? (
          <div className="mt-4 space-y-2.5">
            {harvestables.map(({ h, t }) => (
              <div key={h.id} className="surface-2 rounded-xl p-3.5">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <Mark mono={h.mono} hue={h.hue} size="sm" />
                    <div>
                      <p className="text-[12px] font-semibold">{h.symbol}</p>
                      <p className="text-[10px] num text-faint">{t.isLT ? 'long-term' : 'short-term'} loss</p>
                    </div>
                  </div>
                  <p className="text-[13px] num font-semibold" style={{ color: 'var(--danger)' }}>{fmtINR(Math.round(t.gain))}</p>
                </div>
              </div>
            ))}
            <p className="text-[11px] text-faint leading-relaxed pt-1">
              Booking these losses could offset {fmtINR(Math.round(Math.abs(losses)))} of taxable gains.
              Short-term losses can offset both ST and LT gains.
            </p>
          </div>
        ) : (
          <p className="mt-4 text-[12px] text-muted">No unrealized losses right now — nothing to harvest. 🎉</p>
        )}
      </div>
    </div>
  );
}

              <span className="mt-[5px] w-1.5 h-1.5 rounded-full shrink-0" style={{ background: 'var(--warning)' }}></span>
              <p className="text-[12px] leading-snug" style={{ color: 'var(--warning)' }}>
                Selling now books a short-term gain taxed at 20%. Waiting {tax.daysToLT} days drops it to 12.5% —
                roughly {fmtINR(Math.round(tax.gain * (STCG_RATE - LTCG_RATE)))} less tax on today's gain.
              </p>
            </div>
          )}

          {/* verdict */}
          <div className="mt-4 rounded-xl p-4 flex items-center gap-3" style={{ background: `var(--${action.var}-soft)` }}>
            <span className="w-2 h-2 rounded-full pulse-dot shrink-0" style={{ background: `var(--${action.var})`, color: `var(--${action.var})` }}></span>
            <div>
              <p className="font-semibold text-[13px]" style={{ color: `var(--${action.var})` }}>{action.long}</p>
              <p className="text-[11px] text-muted mt-0.5">Based on news flow, sentiment trend, thesis health, and upcoming events.</p>
            </div>
          </div>

          {/* news */}
          <div className="mt-5">
            <p className="text-[10px] uppercase tracking-[0.1em] text-faint font-semibold mb-2">What's moving it</p>
            <div className="space-y-2">
              {h.news.map((n, i) => (
                <div key={i} className="surface rounded-xl p-3 flex items-start gap-3">
                  <span className="text-[9px] font-semibold uppercase tracking-[0.08em] px-1.5 py-0.5 rounded whitespace-nowrap mt-0.5" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>{n.tag}</span>
                  <div>
                    <p className="text-[13px] leading-snug">{n.text}</p>
                    <p className="text-[10px] num text-faint mt-1">{n.time}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* events */}
          <div className="mt-5 pb-1">
            <p className="text-[10px] uppercase tracking-[0.1em] text-faint font-semibold mb-2">On the horizon</p>
            <div className="flex flex-wrap gap-2">
              {h.events.map((e, i) => {
                const tone = { earnings: 'accent', dividend: 'accent', corporate: 'warning', risk: 'danger' }[e.type] || 'accent';
                const style = tone === 'accent' ? { background: 'var(--accent-soft)', color: 'var(--accent)' } : { background: `var(--${tone}-soft)`, color: `var(--${tone})` };
                return (
                  <span key={i} className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[11px] font-medium" style={style}>
                    <svg width="11" height="11" viewBox="0 0 15 15" fill="none"><rect x="2" y="3" width="11" height="10" rx="1.5" stroke="currentColor"/><path d="M2 6h11M5 1.5V4M10 1.5V4" stroke="currentColor" strokeLinecap="round"/></svg>
                    {e.label} · <span className="num">{e.date}</span>
                  </span>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function AddHoldingModal({ onClose, onAdd }) {
  const [mode, setMode] = useState('search');
  const [query, setQuery] = useState('');
  const [picked, setPicked] = useState(null);
  const [qty, setQty] = useState('');
  const [price, setPrice] = useState('');
  const [fileName, setFileName] = useState(null);
  const fileRef = useRef(null);

  const results = query.trim() ? SEARCHABLE.filter(s => (s.symbol + s.name).toLowerCase().includes(query.toLowerCase())) : SEARCHABLE;
  const handleFile = e => { const f = e.target.files[0]; if (f) setFileName(f.name); };

  const submitManual = () => {
    if (!picked || !qty || !price) return;
    onAdd({
      id: picked.symbol.toLowerCase(),
      symbol: picked.symbol, name: picked.name, mono: picked.mono, hue: picked.hue,
      qty: Number(qty), avgPrice: Number(price), ltp: Math.round(Number(price) * (1 + (Math.random() * 0.2 - 0.1))),
      sector: 'Diversified', buyDate: TODAY.toISOString().slice(0, 10),
      sentiment: 'neutral', sentimentScore: 50 + Math.round(Math.random() * 20 - 10), alpha: 0,
      thesis: 'Add a note about why you bought this — future-you will thank you.',
      thesisStatus: 'intact',
      news: [{ tag: 'Update', text: `Tracking ${picked.symbol} — fresh news will appear here as it breaks.`, time: 'just now' }],
      events: [{ label: 'Next earnings window', date: 'TBA', type: 'earnings' }],
      action: 'watch',
    });
    onClose();
  };
  const submitUpload = () => { onAdd('demo-batch'); onClose(); };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center backdrop-blur-sm" style={{ background: 'rgba(5,5,8,0.55)' }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl p-6 sm:p-7 shadow-2xl max-h-[90vh] overflow-y-auto fade-up"
        style={{ background: 'var(--bg-soft)', border: '1px solid var(--border)' }}>
        <div className="flex items-center justify-between">
          <h3 className="font-semibold text-base tracking-tight">Add to your holdings</h3>
          <button onClick={onClose} className="w-8 h-8 rounded-lg surface flex items-center justify-center text-muted hover:text-current transition-colors">
            <svg width="12" height="12" viewBox="0 0 15 15" fill="none"><path d="M3 3l9 9M12 3l-9 9" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
          </button>
        </div>

        <div className="mt-5 flex surface-2 rounded-lg p-1">
          {[['search', 'Search & add'], ['upload', 'Upload P&L / CSV']].map(([key, label]) => (
            <button key={key} onClick={() => setMode(key)}
              className="flex-1 text-[13px] font-medium py-2 rounded-md transition-colors"
              style={mode === key ? { background: 'var(--surface)', color: 'var(--text)', boxShadow: '0 1px 3px rgba(0,0,0,0.12)' } : { color: 'var(--text-muted)' }}>
              {label}
            </button>
          ))}
        </div>

        {mode === 'search' && (
          <div className="mt-5 space-y-4">
            <div>
              <input value={query} onChange={e => { setQuery(e.target.value); setPicked(null); }}
                placeholder="Search a stock — e.g. RELIANCE, ICICI..."
                className="w-full px-3.5 py-2.5 rounded-lg text-[13px] outline-none ring-focus transition-all"
                style={{ background: 'var(--surface)', border: '1px solid var(--border)', color: 'var(--text)' }} />
              <div className="mt-2 max-h-44 overflow-y-auto space-y-1 pr-1">
                {results.map(s => (
                  <button key={s.symbol} onClick={() => { setPicked(s); setQuery(s.symbol); }}
                    className="w-full flex items-center gap-3 px-2.5 py-2 rounded-lg text-left transition-colors"
                    style={picked?.symbol === s.symbol
                      ? { border: '1px solid var(--accent)', background: 'var(--accent-soft)' }
                      : { border: '1px solid var(--border)', background: 'var(--surface)' }}>
                    <Mark mono={s.mono} hue={s.hue} size="sm" />
                    <span className="min-w-0">
                      <span className="block text-[13px] font-semibold truncate">{s.symbol}</span>
                      <span className="block text-[11px] text-faint truncate">{s.name}</span>
                    </span>
                  </button>
                ))}
              </div>
            </div>
            {picked && (
              <div className="grid grid-cols-2 gap-2.5">
                <input value={qty} onChange={e => setQty(e.target.value.replace(/[^0-9]/g, ''))} type="text" placeholder="Quantity"
                  className="px-3.5 py-2.5 rounded-lg text-[13px] num outline-none ring-focus" style={{ background: 'var(--surface)', border: '1px solid var(--border)', color: 'var(--text)' }} />
                <input value={price} onChange={e => setPrice(e.target.value.replace(/[^0-9.]/g, ''))} type="text" placeholder="Avg. buy price"
                  className="px-3.5 py-2.5 rounded-lg text-[13px] num outline-none ring-focus" style={{ background: 'var(--surface)', border: '1px solid var(--border)', color: 'var(--text)' }} />
              </div>
            )}
            <button onClick={submitManual} disabled={!picked || !qty || !price}
              className="w-full py-3 rounded-lg font-semibold text-[13px] transition-opacity disabled:opacity-30 disabled:cursor-not-allowed"
              style={{ background: 'var(--text)', color: 'var(--bg)' }}>
              Add to portfolio
            </button>
          </div>
        )}

        {mode === 'upload' && (
          <div className="mt-5 space-y-4">
            <div onClick={() => fileRef.current.click()}
              className="rounded-xl p-8 text-center cursor-pointer transition-colors"
              style={{ border: '1.5px dashed var(--border-strong)', background: 'var(--surface-2)' }}>
              <p className="text-[13px] font-medium">{fileName || 'Drop your P&L statement or holdings CSV'}</p>
              <p className="text-[11px] text-faint mt-1.5">Supports CSV, XLSX from Zerodha, Groww, Upstox & more</p>
              <input ref={fileRef} type="file" accept=".csv,.xlsx,.pdf" className="hidden" onChange={handleFile} />
            </div>
            <button onClick={submitUpload} disabled={!fileName}
              className="w-full py-3 rounded-lg font-semibold text-[13px] transition-opacity disabled:opacity-30 disabled:cursor-not-allowed"
              style={{ background: 'var(--text)', color: 'var(--bg)' }}>
              Parse & import holdings
            </button>
            <p className="text-[11px] text-center text-faint">Prototype — uploading loads a sample portfolio so you can see how it works.</p>
          </div>
        )}
      </div>
    </div>
  );
}

/* ================================= APP ===================================== */
function App() {
  const [theme, setTheme] = useTheme();
  const [investorMode, setInvestorMode] = useState(() => localStorage.getItem('holdr-mode') || 'longterm');
  const [holdings, setHoldings] = useState(DEMO_HOLDINGS);
  const [active, setActive] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [tab, setTab] = useState('today');
  const [filter, setFilter] = useState('all');
  const [toast, setToast] = useState(null);
  const [period, setPeriod] = useState(investorMode === 'active' ? '1W' : '1Y');

  useEffect(() => { localStorage.setItem('holdr-mode', investorMode); }, [investorMode]);

  const flash = msg => { setToast(msg); setTimeout(() => setToast(null), 2600); };

  const setMode = m => {
    setInvestorMode(m);
    setPeriod(m === 'active' ? '1W' : '1Y');
    flash(m === 'active' ? 'Active mode — day moves and momentum up front' : 'Long-term mode — the calm, zoomed-out view');
  };

  const handleAdd = entry => {
    if (entry === 'demo-batch') {
      const fresh = DEMO_HOLDINGS.filter(h => !holdings.some(x => x.id === h.id));
      if (fresh.length === 0) { flash('Sample portfolio is already loaded'); return; }
      setHoldings(prev => [...prev, ...fresh]);
      flash(`Imported ${fresh.length} holdings from your file`);
    } else {
      setHoldings(prev => [entry, ...prev.filter(h => h.id !== entry.id)]);
      flash(`${entry.symbol} added to your portfolio`);
    }
  };

  const totals = useMemo(() => {
    const invested = holdings.reduce((a, h) => a + h.qty * h.avgPrice, 0);
    const current = holdings.reduce((a, h) => a + h.qty * h.ltp, 0);
    const pnl = current - invested;
    const needsReview = holdings.filter(h => h.action === 'review').length;
    const avgSentiment = Math.round(holdings.reduce((a, h) => a + h.sentimentScore, 0) / (holdings.length || 1));
    const alphaPeriod = holdings.reduce((a, h) => a + h.alpha * (h.qty * h.ltp), 0) / (current || 1);
    return { invested, current, pnl, pnlPct: (pnl / invested) * 100, needsReview, avgSentiment, alphaPeriod };
  }, [holdings]);

  const trends = useMemo(() => {
    const map = {};
    holdings.forEach(h => {
      const positive = h.ltp >= h.avgPrice;
      map[h.id] = {
        series: genTrend(h.id + period, h.ltp, 22, positive),
        dayChange: ((seedRandom(seedFromString(h.id + 'day'))() * 5 - 2.5) + (h.sentiment === 'positive' ? 0.6 : h.sentiment === 'negative' ? -0.6 : 0)),
      };
    });
    return map;
  }, [holdings, period]);

  const portfolioTrend = useMemo(() => genTrend('portfolio-' + period + holdings.length, totals.current, 30, totals.pnl >= 0), [totals.current, totals.pnl, holdings.length, period]);
  const benchmarkTrend = useMemo(() => genTrend('nifty-' + period, 100, 30, true), [period]);

  const filtered = useMemo(() => {
    let list = holdings.filter(h => filter === 'all' ? true : h.action === filter);
    if (investorMode === 'active') {
      list = [...list].sort((a, b) => Math.abs(trends[b.id]?.dayChange ?? 0) - Math.abs(trends[a.id]?.dayChange ?? 0));
    } else {
      const order = { review: 0, watch: 1, hold: 2 };
      list = [...list].sort((a, b) => order[a.action] - order[b.action]);
    }
    return list;
  }, [holdings, filter, investorMode, trends]);

  const filters = [['all', 'All'], ['hold', 'Looking good'], ['watch', 'Worth watching'], ['review', 'Needs review']];
  const periods = ['1W', '1M', '3M', '1Y'];
  const tabs = [['today', 'Today'], ['holdings', 'Holdings'], ['tax', 'Tax'], ['discover', 'Discover']];

  return (
    <div className="min-h-screen pb-16 relative">
      <div className="chart-grid"></div>
      <div className="glow" style={{ width: 480, height: 480, top: -200, left: '12%', background: 'var(--accent)' }}></div>
      <div className="glow" style={{ width: 420, height: 420, top: -160, right: '8%', background: 'var(--accent-2)' }}></div>

      {/* Header */}
      <header className="sticky top-0 z-40 backdrop-blur-md" style={{ borderBottom: '1px solid var(--border)', background: 'color-mix(in srgb, var(--bg) 78%, transparent)' }}>
        <div className="max-w-7xl mx-auto px-5 sm:px-8 py-3.5 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-8 h-8 rounded-lg surface flex items-end justify-center gap-[3px] pb-[7px]">
              <span className="w-[3px] h-[8px] rounded-full" style={{ background: 'var(--danger)' }}></span>
              <span className="w-[3px] h-[14px] rounded-full" style={{ background: 'var(--accent)' }}></span>
              <span className="w-[3px] h-[11px] rounded-full" style={{ background: 'var(--success)' }}></span>
            </div>
            <div>
              <p className="font-semibold leading-none tracking-tight text-[15px]">Holdr</p>
              <p className="text-[10px] text-faint leading-none mt-1 tracking-wide">KNOW WHAT YOU HOLD</p>
            </div>
          </div>

          <div className="flex items-center gap-2">
            {/* investor mode switch */}
            <div className="hidden md:flex surface rounded-lg p-0.5">
              {[['longterm', 'Long-term'], ['active', 'Active']].map(([key, label]) => (
                <button key={key} onClick={() => setMode(key)}
                  className="px-3 py-1.5 rounded-md text-[11px] font-semibold transition-colors"
                  style={investorMode === key ? { background: 'var(--surface-2)', color: 'var(--text)', border: '1px solid var(--border)' } : { color: 'var(--text-faint)', border: '1px solid transparent' }}>
                  {label}
                </button>
              ))}
            </div>
            <div className="hidden sm:flex items-center gap-2 px-3 py-2 rounded-lg surface">
              <span className="w-1.5 h-1.5 rounded-full pulse-dot" style={{ background: 'var(--success)', color: 'var(--success)' }}></span>
              <span className="text-[11px] font-medium text-muted">Market open</span>
            </div>
            <ThemeToggle theme={theme} setTheme={setTheme} />
            <button onClick={() => setShowAdd(true)}
              className="px-3.5 sm:px-4 py-2 rounded-lg text-[13px] font-semibold transition-opacity hover:opacity-90 flex items-center gap-1.5"
              style={{ background: 'var(--text)', color: 'var(--bg)' }}>
              <span className="text-sm leading-none">+</span> <span className="hidden sm:inline">Add holding</span>
            </button>
          </div>
        </div>

        {/* tab nav */}
        <div className="max-w-7xl mx-auto px-5 sm:px-8 flex items-center gap-1 -mb-px">
          {tabs.map(([key, label]) => (
            <button key={key} onClick={() => setTab(key)}
              className="px-3.5 py-2.5 text-[13px] font-medium transition-colors relative"
              style={{ color: tab === key ? 'var(--text)' : 'var(--text-faint)' }}>
              {label}
              {tab === key && <span className="absolute bottom-0 left-3 right-3 h-[2px] rounded-full" style={{ background: 'var(--accent)' }}></span>}
            </button>
          ))}
        </div>
      </header>

      {/* Ticker tape — active mode only; long-term stays calm */}
      {investorMode === 'active' && <TickerTape holdings={holdings} trends={trends} />}

      <main className="max-w-7xl mx-auto px-5 sm:px-8 relative z-10">

        {tab === 'today' && (
          <div className="fade-up">
            {/* Hero strip */}
            <section className="mt-8 flex items-end justify-between gap-6">
              <div>
                <p className="text-[11px] font-semibold tracking-[0.14em] uppercase" style={{ color: 'var(--accent)' }}>
                  {investorMode === 'active' ? 'Active view · day moves first' : 'Long-term view · the zoomed-out picture'}
                </p>
                <h1 className="text-[24px] sm:text-[30px] font-semibold leading-[1.15] tracking-tight mt-2">
                  {investorMode === 'active'
                    ? <>Markets are moving.<br/><span className="text-muted">Here's what moved <em className="not-italic" style={{ color: 'var(--text)' }}>yours</em>.</span></>
                    : <>Welcome back.<br/><span className="text-muted">Here's what changed while you <em className="not-italic" style={{ color: 'var(--text)' }}>weren't looking</em>.</span></>}
                </h1>
              </div>
              <CandleDeco width={210} height={100} seed="hero" className="hidden md:block opacity-80 shrink-0" />

            {/* Digest + chart row */}

                      <Tone varName={totals.alphaPeriod >= 0 ? 'success' : 'warning'} mono>

              </div>
              <p className="hidden sm:block text-[11px] num text-faint">
                {investorMode === 'active' ? 'sorted by day move' : 'sorted by attention'} · {filtered.length} of {holdings.length}
              </p>
            </section>

            <section className="mt-3 surface rounded-2xl overflow-hidden">
              <div className="hidden sm:flex items-center gap-4 px-5 py-2.5 text-[9px] uppercase tracking-[0.1em] text-faint font-semibold" style={{ borderBottom: '1px solid var(--border)', background: 'var(--surface-2)' }}>
                <div className="w-[42%] sm:w-[24%]">Position</div>
                <div className="hidden md:block w-[13%]">Trend</div>
                <div className="hidden sm:block w-[14%]">LTP / Day</div>
                <div className="flex-1 sm:flex-none sm:w-[15%]">P&amp;L</div>
                <div className="hidden lg:block w-[12%]">vs NIFTY</div>
                <div className="hidden lg:block w-[12%]">Tax</div>
                <div className="hidden xl:block w-[14%] text-right">Thesis</div>
                <div className="w-3.5"></div>
              </div>
              {filtered.map(h => {
                const weight = (h.qty * h.ltp / totals.current) * 100;
                return <HoldingRow key={h.id} h={{ ...h, _dayChange: trends[h.id].dayChange }} trend={trends[h.id].series} weight={weight} onOpen={setActive} />;
              })}
              {filtered.length === 0 && (
                <div className="text-center py-16 text-faint"><p className="font-medium text-[13px]">Nothing in this view — try another filter.</p></div>
              )}
            </section>

            <section className="mt-5 mb-2">
              <button onClick={() => setShowAdd(true)}
                className="w-full rounded-2xl p-5 text-center transition-colors group lift"
                style={{ border: '1.5px dashed var(--border-strong)', background: 'transparent' }}>
                <p className="font-semibold text-[13px]">+ Add another position</p>
                <p className="text-[11px] text-faint mt-1">Search & add manually, or upload your broker's P&L / holdings statement</p>
              </button>
            </section>
          </div>
        )}

        {tab === 'tax' && (
          <div className="mt-8">
            <TaxView holdings={holdings} />
            <p className="text-[11px] text-faint mt-4 text-center">Indicative numbers for planning only — confirm with a tax professional before acting.</p>
          </div>
        )}

        {tab === 'discover' && (
          <div className="mt-8">
            <DiscoverView holdings={holdings} />
          </div>
        )}
      </main>

      {active && <HoldingDetail h={active} trend={trends[active.id]?.series || genTrend(active.id, active.ltp)} onClose={() => setActive(null)} />}
      {showAdd && <AddHoldingModal onClose={() => setShowAdd(false)} onAdd={handleAdd} />}

      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] text-[13px] font-medium px-4 py-2.5 rounded-lg shadow-2xl fade-up"
          style={{ background: 'var(--text)', color: 'var(--bg)' }}>
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
